<!doctype html>
<html lang="bg"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Мариполия — игри за памет, внимание, концентрация, таланти и реч за деца от 3 до 10 години.">
<meta name="theme-color" content="#FBF8F1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Мариполия">
<script>if("serviceWorker" in navigator&&location.protocol.startsWith("http"))
 addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
</head><body>
<title>Мариполия</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=Commissioner:wght@300;400;500;600;700&family=Nunito:wght@500;700;800;900&display=swap">
<style>
:root{
  --paper:#FBF8F1; --surface:#FFFDF8; --surface-2:#F3EDE0;
  --rule:#DED3BC; --grid:#EBE2CE;
  --ink:#14346B; --accent:#1F5FD0; --red:#B8442A; --ok:#2E7D51;
  --text:#2A2620; --muted:#6F6659;
  --c-red:#E8502F; --c-orange:#F2A93B; --c-yellow:#F6D64A; --c-green:#4CAF6D;
  --c-blue:#2E7CC4; --c-purple:#7E57C2;
  --tap:56px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#14161C; --surface:#1B1E26; --surface-2:#242835;
  --rule:#343B4A; --grid:#262B36;
  --ink:#9FBCF0; --accent:#7FA6EC; --red:#E88A70; --ok:#6FCB99;
  --text:#E6E3DC; --muted:#9A968C;
}}
:root[data-theme="dark"]{
  --paper:#14161C; --surface:#1B1E26; --surface-2:#242835;
  --rule:#343B4A; --grid:#262B36;
  --ink:#9FBCF0; --accent:#7FA6EC; --red:#E88A70; --ok:#6FCB99;
  --text:#E6E3DC; --muted:#9A968C;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--paper);color:var(--text);
  font-family:"Commissioner",system-ui,sans-serif;font-size:17px;line-height:1.6;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1000px;margin:0 auto;padding-inline:20px;padding-block:0 72px}

header{background:
  repeating-linear-gradient(to right,var(--grid) 0 1px,transparent 1px 22px),
  repeating-linear-gradient(to bottom,var(--grid) 0 1px,transparent 1px 22px),var(--surface);
  border-bottom:1px solid var(--rule)}
.hin{max-width:1000px;margin:0 auto;padding-inline:20px;padding-block:34px 28px;
  display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
h1{font-family:"Literata",Georgia,serif;font-weight:600;font-size:clamp(24px,5vw,34px);
  margin:0;letter-spacing:-.015em;line-height:1.15}
.eyebrow{font-size:11.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink);
  font-weight:600;margin:0 0 8px}
.hstat{font-size:13px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.hstat b{color:var(--ink);font-size:20px;font-family:"Literata",serif;display:block}

nav.tabs{padding-block:22px 20px;display:flex;flex-direction:column;gap:10px}
.tabrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tabrow button{font:inherit;font-size:14px;font-weight:500;padding:9px 15px;min-height:44px;
  border:1px solid var(--rule);background:var(--surface);color:var(--muted);
  border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.tabrow button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.tabrow button[disabled]{opacity:.38;cursor:default}
.tabrow button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabrow .cnt{font-size:11.5px;font-variant-numeric:tabular-nums;opacity:.65;
  font-family:"Literata",serif}
.tabrow.ages button{border-style:dashed}
.tabrow.ages button[aria-pressed="true"]{border-style:solid;background:var(--c-green);
  border-color:var(--c-green);color:#13301F}
.tag.age{background:color-mix(in srgb,var(--c-green) 24%,transparent);color:var(--text);
  font-variant-numeric:tabular-nums}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(256px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:13px;
  padding:17px 18px;text-align:left;cursor:pointer;font:inherit;color:inherit;
  display:flex;flex-direction:column;gap:7px;position:relative;min-height:112px}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card .t{font-family:"Literata",serif;font-size:18px;font-weight:600;line-height:1.25;
  padding-right:24px}
.card .m{font-size:13.5px;color:var(--muted);line-height:1.45}
.card .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.tag{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;
  padding:3px 8px;border-radius:4px;background:var(--surface-2);color:var(--muted)}
.tag.nova{background:color-mix(in srgb,var(--c-purple) 20%,transparent);color:var(--text)}
.tag.goal{background:color-mix(in srgb,var(--ink) 13%,transparent);color:var(--ink)}
.card .done{position:absolute;top:15px;right:16px;width:20px;height:20px;border-radius:50%;
  background:var(--ok);color:#fff;font-size:12px;display:grid;place-items:center;font-weight:700}

/* ---------- задача ---------- */
.back{font:inherit;font-size:14px;color:var(--ink);background:none;border:0;cursor:pointer;
  padding:20px 4px 14px;min-height:44px;display:flex;gap:7px;align-items:center}
.task-h{border-bottom:1px solid var(--rule);padding-bottom:16px;margin-bottom:22px}
.task-h h2{font-family:"Literata",serif;font-size:23px;font-weight:600;margin:0 0 7px;line-height:1.3}
.agebadge{font-family:"Commissioner",sans-serif;font-size:12px;font-weight:600;
  letter-spacing:.04em;padding:4px 10px;border-radius:999px;vertical-align:3px;
  background:color-mix(in srgb,var(--c-green) 26%,transparent);color:var(--text);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.instr{font-size:21px;line-height:1.4;margin:0;max-width:50ch}
.hint{font-size:14px;color:var(--muted);margin:10px 0 0}

.stage{background:var(--surface);border:1px solid var(--rule);border-radius:15px;
  padding:24px 18px;margin-bottom:16px}

.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:flex-start}
.item{background:var(--surface-2);border:3px solid var(--rule);border-radius:14px;
  width:128px;min-height:var(--tap);padding:10px 8px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  font:inherit;color:inherit;touch-action:manipulation}
.item.sm{width:96px}
.item.lg{width:176px}
.item svg,.item img{width:100%;height:auto;display:block;max-width:104px;margin:0 auto}
.item.lg svg,.item.lg img{max-width:150px}
.item .lbl{font-size:14px;font-weight:500;text-align:center;line-height:1.3}
.item[data-state="ok"]{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}
.item[data-state="no"]{border-color:var(--red);background:color-mix(in srgb,var(--red) 13%,transparent)}
.item[data-state="sel"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);
  transform:translateY(-3px)}
.item[disabled]{opacity:.45;cursor:default}
.item:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.slotwrap{display:flex;flex-direction:column;align-items:center;gap:5px}
.ordnum{font-family:"Literata",serif;font-size:14px;color:var(--muted);
  font-variant-numeric:tabular-nums}
.qmark{display:grid;place-items:center;font-family:"Literata",serif;font-size:46px;
  color:var(--muted);min-height:104px;width:100%}
.lead{margin-bottom:20px;padding-bottom:20px;border-bottom:2px dashed var(--rule)}

/* редове от предмети за броене */
.countrow{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;
  background:var(--surface-2);border-radius:12px;padding:16px;margin-bottom:20px}
.countrow svg{width:64px;height:64px}

/* числа и знаци */
.pad{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.key{font:inherit;font-family:"Literata",serif;font-size:26px;font-weight:600;
  width:var(--tap);height:var(--tap);border-radius:13px;border:3px solid var(--rule);
  background:var(--surface-2);color:var(--text);cursor:pointer;touch-action:manipulation}
.key.wide{width:auto;padding-inline:22px}
.key[data-state="ok"]{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,transparent)}
.key[data-state="no"]{border-color:var(--red);background:color-mix(in srgb,var(--red) 14%,transparent)}
.key:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* две страни при сравнение */
.sides{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:nowrap;
  margin-bottom:22px}
.side{background:var(--surface-2);border-radius:13px;padding:14px 12px;
  flex:1 1 0;min-width:0;max-width:340px;
  display:flex;flex-wrap:wrap;gap:7px;justify-content:center;align-content:center}
@media (max-width:480px){.sides{flex-wrap:wrap}.side{flex:1 1 100%;max-width:none}
  .gap{width:100%}}
.side svg{width:52px;height:52px}
.gap{font-family:"Literata",serif;font-size:38px;color:var(--muted);min-width:46px;text-align:center}

/* мрежи */
.gridbox{display:flex;gap:22px;justify-content:center;flex-wrap:wrap;align-items:center}
.gr{display:grid;gap:4px;background:var(--rule);border:3px solid var(--rule);border-radius:10px;
  padding:4px}
.gc{background:var(--surface);width:58px;height:58px;display:grid;place-items:center;
  cursor:pointer;touch-action:manipulation;border-radius:5px}
.gc.fixed{cursor:default;background:var(--surface-2)}
.gc svg{width:42px;height:42px}
.gc[data-state="sel"]{background:color-mix(in srgb,var(--accent) 20%,transparent)}
.gc[data-state="ok"]{background:color-mix(in srgb,var(--ok) 18%,transparent)}
.gc[data-state="no"]{background:color-mix(in srgb,var(--red) 16%,transparent)}
.arrowto{font-size:30px;color:var(--muted)}
.mirrorline{width:3px;align-self:stretch;background:var(--accent);border-radius:2px;opacity:.5}

/* палитра цветове */
.swatches{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.sw{width:var(--tap);height:var(--tap);border-radius:50%;border:3px solid var(--rule);
  cursor:pointer;touch-action:manipulation;position:relative}
.sw[data-state="sel"]{border-color:var(--ink);transform:scale(1.1)}
.sw span{position:absolute;inset:0;display:grid;place-items:center;
  font-family:"Literata",serif;font-weight:600;font-size:19px;color:#2B2B2B}

/* проследяване */
.tracebox{max-width:640px;margin:0 auto;touch-action:none}
.tracebox svg{width:100%;height:auto;display:block;cursor:crosshair;touch-action:none}

.feedback{text-align:center;font-size:18px;font-weight:600;min-height:30px;margin:14px 0 4px}
.feedback[data-k="ok"]{color:var(--ok)}
.feedback[data-k="no"]{color:var(--red)}
.controls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
button.btn{font:inherit;font-size:16px;font-weight:500;padding:12px 24px;min-height:var(--tap);
  border-radius:11px;border:2px solid var(--ink);background:var(--ink);color:var(--paper);
  cursor:pointer;touch-action:manipulation}
button.btn.ghost{background:transparent;color:var(--ink)}
button.btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

.panel{background:var(--surface-2);border:1px solid var(--rule);border-left:3px solid var(--ink);
  border-radius:0 11px 11px 0;padding:16px 19px;margin-top:20px}
.panel h3{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);
  margin:0 0 9px;font-weight:600}
.panel p{margin:0 0 9px;font-size:14.5px;line-height:1.55}
.panel p:last-child{margin:0}
.panel .src{font-size:12.5px;color:var(--muted)}
.empty{color:var(--muted);padding:30px 0}

/* ---------- търсене ---------- */
.searchrow{display:flex;gap:10px;align-items:center;margin-bottom:16px}
.searchrow .sbox{flex:1 1 auto;display:flex;align-items:center;gap:9px;
  background:var(--surface);border:1px solid var(--rule);border-radius:999px;
  padding:0 8px 0 16px;min-height:48px;max-width:520px}
.searchrow input{flex:1 1 auto;font:inherit;font-size:16px;border:0;outline:0;
  background:none;color:var(--text);min-width:0;padding:11px 0}
.searchrow input::placeholder{color:var(--muted)}
.searchrow input::-webkit-search-cancel-button{display:none}
.searchrow .sbox:focus-within{border-color:var(--accent)}
.searchrow .sx{border:0;background:none;cursor:pointer;color:var(--muted);
  font:inherit;font-size:20px;line-height:1;width:36px;height:36px;border-radius:50%}
.searchrow .sx:hover{background:var(--surface-2);color:var(--text)}
.searchrow .scount{font-size:13.5px;color:var(--muted);white-space:nowrap;
  font-variant-numeric:tabular-nums}
.hit{background:color-mix(in srgb,var(--c-yellow) 55%,transparent);border-radius:3px}



/* ---------- превоз през реката ---------- */
.ferry{display:flex;gap:10px;align-items:stretch;justify-content:center}
.ferry .bank{flex:1 1 0;min-width:0;display:flex;flex-wrap:wrap;gap:8px;
  justify-content:center;align-content:flex-start;
  background:color-mix(in srgb,var(--c-green) 13%,var(--surface-2));
  border-radius:13px;padding:12px 8px;min-height:190px}
.ferry .river{flex:0 0 108px;display:flex;align-items:flex-end;justify-content:center;
  background:color-mix(in srgb,var(--c-blue) 22%,var(--surface-2));
  border-radius:13px;padding:10px 6px;position:relative;overflow:hidden}
.ferry .river::before{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(to bottom,
    color-mix(in srgb,var(--c-blue) 32%,transparent) 0 2px,transparent 2px 14px)}
.ferry .boat{position:relative;width:100%;display:flex;justify-content:center;
  padding:9px 4px;border-radius:10px;background:var(--surface);
  border:2px solid var(--rule);transition:transform .45s ease}
.ferry .river[data-man="1"] .boat{transform:translateY(-4px)}
.ferry .boat{flex-direction:column;gap:6px;align-items:center}
.ferry .boat .hull{width:88px;display:block}
.ferry .fempty{font-size:13px;color:var(--muted);padding:14px 0 4px}
.fitem{background:var(--surface);border:3px solid var(--rule);border-radius:12px;
  width:82px;padding:7px 5px;cursor:pointer;font:inherit;color:inherit;
  display:flex;flex-direction:column;align-items:center;gap:4px;touch-action:manipulation}
.fitem img,.fitem svg{width:100%;height:auto;max-width:56px;display:block}
.fitem .lbl{font-size:12.5px;font-weight:500}
.fitem.man{border-style:dashed;opacity:.9;cursor:default}
.fitem[disabled]:not(.man){opacity:.5;cursor:default}
@media (max-width:520px){.ferry .river{flex:0 0 86px}.fitem{width:70px}}


/* ---------- матрици ---------- */
.gr.rv .gc{width:74px;height:74px}
.gr.rv .gc svg{width:62px;height:62px}
.item.sm svg{max-width:62px}
@media (max-width:520px){.gr.rv .gc{width:62px;height:62px}.gr.rv .gc svg{width:52px;height:52px}}


/* ---------- печатен лист ---------- */
#printsheet{display:none}
@media print{
  body.printing > *:not(#printsheet){display:none!important}
  body.printing #printsheet{display:block;padding:12mm;color:#000;background:#fff}
}

/* ---------- лента за режима ---------- */
.modebar{padding-top:22px}
.mb{display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:12px 14px}
.mbt{font-size:14.5px;color:var(--muted);margin-right:auto}
.mbt b{color:var(--ink);font-family:"Literata",serif;font-size:17px}
button.btn.sm{font-size:14px;padding:9px 16px;min-height:44px;border-radius:9px}
.card.pick{border-style:dashed}
.card.pick[data-on="1"]{border-style:solid;border-color:var(--c-green);
  background:color-mix(in srgb,var(--c-green) 9%,var(--surface))}
.chk{position:absolute;top:14px;right:15px;width:24px;height:24px;border-radius:7px;
  border:2px solid var(--rule);display:grid;place-items:center;font-size:14px;font-weight:700;
  color:#13301F}
.card.pick[data-on="1"] .chk{background:var(--c-green);border-color:var(--c-green)}

/* ---------- линк и код ---------- */
.linkbox{display:flex;gap:10px;flex-wrap:wrap;align-items:center;
  background:var(--surface-2);border-radius:11px;padding:13px 15px}
.linkbox code{font-family:ui-monospace,Menlo,monospace;font-size:13px;word-break:break-all;
  flex:1 1 220px;color:var(--ink)}
.hwlist{margin:18px 0 0;padding-left:22px;font-size:15px;line-height:1.75}
.mut{color:var(--muted);font-size:14.5px}
.codein{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:20px}
.codein input{font:inherit;font-family:"Literata",serif;font-size:24px;letter-spacing:.12em;
  text-align:center;width:190px;padding:11px 14px;border-radius:11px;
  border:2px solid var(--rule);background:var(--surface-2);color:var(--text);text-transform:uppercase}
.codein input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.resrow{display:flex;gap:16px;justify-content:center;margin-bottom:20px;text-align:center}
.resrow .rn{font-family:"Literata",serif;font-size:30px;font-weight:600;color:var(--ink);
  font-variant-numeric:tabular-nums}
.resrow .rl{font-size:13px;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:7px;max-width:420px;margin:0 auto}
.bar{display:flex;gap:11px;align-items:center;font-size:14px}
.bar .bi{font-family:"Literata",serif;color:var(--muted);width:20px;text-align:right;
  font-variant-numeric:tabular-nums}
.bar .bb{width:44px;height:11px;border-radius:6px;flex:none}
.bar .bb.a{background:var(--c-green)} .bar .bb.b{background:var(--c-yellow)}
.bar .bb.c{background:var(--c-orange)} .bar .bb.z{background:var(--rule)}
.bar .bv{color:var(--muted)}

/* ---------- домашен режим ---------- */
.dots{display:flex;gap:8px;justify-content:center;padding:22px 0 8px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--rule)}
.dot.d{background:var(--c-green)}
.dot.c{background:var(--ink);transform:scale(1.35)}
.done-screen{text-align:center;padding-top:34px}
.done-screen h2{font-family:"Literata",serif;font-size:32px;margin:14px 0 8px}
.stars{display:flex;gap:10px;justify-content:center}
.stars svg{width:54px;height:54px}
.bigcode{font-family:"Literata",serif;font-size:42px;font-weight:600;letter-spacing:.1em;
  color:var(--ink);background:var(--surface);border:2px dashed var(--rule);border-radius:14px;
  padding:16px 26px;display:inline-block;margin:10px 0 22px}

@media (hover:hover){
  .card:hover{border-color:var(--ink)}
  .item:hover:not([disabled]){border-color:var(--ink)}
  .key:hover{border-color:var(--ink)}
}
@media (max-width:520px){
  .item{width:104px}.item.lg{width:140px}.gc{width:50px;height:50px}
  .instr{font-size:19px}
}
@media print{nav.tabs,.back,.controls,.panel,.hstat{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ---------- вход в платформата ---------- */
.auth{max-width:440px;margin:34px auto 0;background:var(--surface);border:1px solid var(--rule);
  border-radius:16px;padding:26px 22px}
.auth h2{font-family:"Literata",serif;font-size:26px;font-weight:600;margin:0 0 6px;line-height:1.25}
.auth .sub{font-size:15px;color:var(--muted);margin:0 0 18px;line-height:1.5}
.auth form{display:flex;flex-direction:column;gap:14px}
.auth label{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500}
.auth input[type=email],.auth input[type=password],.auth input[type=text]{font:inherit;font-size:16px;
  padding:11px 14px;border-radius:10px;border:2px solid var(--rule);background:var(--surface-2);
  color:var(--text);min-height:48px;width:100%}
.auth input[readonly]{opacity:.75}
.auth input:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.auth .hintx{font-size:12.5px;font-weight:400;color:var(--muted)}
.pw{display:flex;gap:8px}.pw input{flex:1 1 auto;min-width:0}
.eye{font:inherit;font-size:13px;border:2px solid var(--rule);background:var(--surface);color:var(--muted);
  border-radius:10px;padding:0 12px;cursor:pointer;min-height:48px;white-space:nowrap}
.auth label.chkl{flex-direction:row;align-items:flex-start;gap:10px;font-weight:400;font-size:14px;line-height:1.45}
.chkl input{width:22px;height:22px;margin:1px 0 0;flex:none;accent-color:var(--ink)}
.err{color:var(--red);font-size:14px;margin:0;min-height:1.2em}
.okmsg{color:var(--ok);font-size:15px;font-weight:500;margin:0}
.btn.full{width:100%}
.lnk{font:inherit;font-size:14px;background:none;border:0;color:var(--accent);cursor:pointer;
  padding:10px 2px;min-height:44px;text-decoration:underline;text-underline-offset:3px}
.alinks{margin:4px 0 0;text-align:center}
.adiv{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin:8px 0 14px}
.adiv::before,.adiv::after{content:"";flex:1;height:1px;background:var(--rule)}
.abtns{display:flex;flex-direction:column;gap:10px}
.lnk.trial{display:block;margin:14px auto 0;text-align:center}
.demo{font-size:13px;color:var(--muted);background:var(--surface-2);border:1px dashed var(--rule);
  border-radius:10px;padding:10px 13px;margin:18px 0 0;line-height:1.55}
.demo b{color:var(--text);font-weight:600}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{font:inherit;font-size:14px;font-weight:500;padding:9px 15px;min-height:44px;
  border:1px solid var(--rule);background:var(--surface);color:var(--muted);border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.avs{display:flex;flex-wrap:wrap;gap:8px}
.avs button{width:68px;height:68px;border-radius:14px;border:3px solid var(--rule);background:var(--surface-2);
  cursor:pointer;padding:6px;display:grid;place-items:center}
.avs button img,.avs button svg{width:100%!important;height:100%!important;object-fit:contain;max-width:none!important}
.avs button[aria-pressed="true"]{border-color:var(--ink);background:color-mix(in srgb,var(--ink) 12%,var(--surface))}
.who{display:flex;align-items:center;gap:12px;margin-left:auto}
.whoname{font-size:14px;font-weight:600;text-align:right;line-height:1.25}
.whoname small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.kids{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:26px}
.kid{background:var(--surface);border:3px solid var(--rule);border-radius:16px;padding:16px 12px;cursor:pointer;
  font:inherit;color:inherit;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:190px;
  touch-action:manipulation}
.kid .av{width:100px;height:100px;display:grid;place-items:center}
.kid .av img,.kid .av svg{width:100%!important;height:100%!important;object-fit:contain;max-width:none!important}
.kid .kn{font-family:"Literata",serif;font-size:21px;font-weight:600}
.kid .ka{font-size:13px;color:var(--muted)}
.kid .kb{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;margin-top:4px;
  background:color-mix(in srgb,var(--c-yellow) 45%,transparent)}
.kid.add{border-style:dashed;justify-content:center;color:var(--muted)}
.kid.add .plus{font-size:44px;line-height:1;font-family:"Literata",serif}
.kid:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.sec{font-family:"Literata",serif;font-size:20px;font-weight:600;margin:34px 0 12px}
.prog{background:var(--surface);border:1px solid var(--rule);border-radius:13px;padding:14px 18px;margin-bottom:12px}
.prog h4{margin:0 0 6px;font-size:16px}
.prow{display:grid;grid-template-columns:118px 1fr 64px;gap:12px;align-items:center;font-size:14px;margin:7px 0}
.prow .pv{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;text-align:right}
.ptrack{height:12px;border-radius:6px;background:var(--surface-2);overflow:hidden;display:flex}
.ptrack i{display:block;height:100%}.ptrack .m{background:var(--c-green)}.ptrack .w{background:var(--c-yellow)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend span{white-space:nowrap}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:0}
@media (max-width:520px){.prow{grid-template-columns:112px 1fr 50px;gap:8px;font-size:13px}.who .whoname small{display:none}}
.kidav{width:120px;height:120px;margin:0 auto}
.kidav img,.kidav svg{width:100%!important;height:100%!important;object-fit:contain;max-width:none!important}
.today{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:22px auto 26px;max-width:460px}
.tile{aspect-ratio:1;border-radius:16px;border:3px solid var(--rule);background:var(--surface);display:grid;
  place-items:center;font-family:"Literata",serif;font-size:28px;font-weight:600;color:var(--muted)}
.tile.d{background:color-mix(in srgb,var(--c-green) 22%,var(--surface));border-color:var(--c-green);color:var(--ok)}
.tile.hw{border-color:var(--ink)}
button.btn.bigplay{display:block;margin:0 auto;font-size:24px;padding:16px 46px;min-height:72px;border-radius:18px}
.klist{display:flex;flex-direction:column;gap:12px}
.krow{background:var(--surface);border:1px solid var(--rule);border-radius:13px;padding:16px 18px}
.krow .kh{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:baseline}
.krow .kh b{font-family:"Literata",serif;font-size:19px}
.krow .kst{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:14px;margin:10px 0 0}
.krow .kst span b{font-family:"Literata",serif;font-size:17px;color:var(--ink);margin-right:4px}
.krow details{margin-top:10px;font-size:14px}
.krow summary{cursor:pointer;color:var(--accent);min-height:32px}
.hist{list-style:none;margin:8px 0 0;padding:0}
.hist li{display:grid;grid-template-columns:92px 1fr auto;gap:10px;padding:6px 0;border-top:1px solid var(--grid)}
.hist .hd{color:var(--muted);font-variant-numeric:tabular-nums}

/* =================== НАЧАЛНА СТРАНИЦА =================== */
:root{
  --l-peach:#FFE6D8; --l-mint:#DDF2E4; --l-sky:#DCEBFA; --l-butter:#FFF1C2; --l-lilac:#ECE4FA; --l-rose:#FCE1E8;
  --l-sky-1:#C6E2FB; --l-sky-2:#FDE6DC; --l-hill:#BFE3B5; --l-hill-2:#A6D69C;
  --l-shadow:0 10px 30px -12px rgba(20,52,107,.22);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --l-peach:#3A2C27; --l-mint:#223328; --l-sky:#1F2C3D; --l-butter:#37321F; --l-lilac:#2C2740; --l-rose:#3A2830;
  --l-sky-1:#22324A; --l-sky-2:#2D2A33; --l-hill:#2F4A34; --l-hill-2:#27402C;
  --l-shadow:0 10px 30px -12px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --l-peach:#3A2C27; --l-mint:#223328; --l-sky:#1F2C3D; --l-butter:#37321F; --l-lilac:#2C2740; --l-rose:#3A2830;
  --l-sky-1:#22324A; --l-sky-2:#2D2A33; --l-hill:#2F4A34; --l-hill-2:#27402C;
  --l-shadow:0 10px 30px -12px rgba(0,0,0,.6);
}
body.landing-on header, body.landing-on .wrap{display:none!important}
#landing{overflow-x:clip}
#landing .lw{max-width:1120px;margin:0 auto;padding-inline:16px}
#landing h2,#landing h3,.l-brand b{font-family:"Nunito","Commissioner",system-ui,sans-serif}
#landing img{user-select:none;-webkit-user-drag:none}

/* горна лента */
.l-nav{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 82%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid color-mix(in srgb,var(--rule) 60%,transparent)}
.l-nav .lw{display:flex;align-items:center;gap:14px;min-height:66px}
.l-brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;color:var(--ink);font:inherit}
.l-brand img{width:40px;height:40px}
.l-brand b{font-size:20px;font-weight:900;line-height:1.05;text-align:left;display:block}
.l-brand small{display:block;font-weight:500;font-size:11.5px;color:var(--muted);letter-spacing:.01em;margin-top:2px}
@media (max-width:420px){.l-brand small{display:none}}
.l-links{display:flex;gap:4px;margin-left:auto}
.l-links button{font:inherit;font-size:15px;font-weight:500;background:none;border:0;color:var(--muted);
  padding:8px 12px;border-radius:999px;cursor:pointer;min-height:44px}
.l-links button:hover{background:var(--surface-2);color:var(--ink)}
.l-nav .l-in{margin-left:6px}
@media (max-width:860px){.l-links{display:none}.l-nav .l-in{margin-left:auto}}

/* бутони */
.lbtn{font:inherit;font-weight:700;font-size:17px;border-radius:999px;cursor:pointer;min-height:56px;
  padding:14px 28px;border:2px solid transparent;display:inline-flex;align-items:center;justify-content:center;gap:10px;
  transition:transform .18s ease, box-shadow .18s ease, background .18s ease;font-family:"Nunito","Commissioner",sans-serif}
.lbtn.p{background:var(--ink);color:var(--paper);box-shadow:0 8px 20px -8px color-mix(in srgb,var(--ink) 70%,transparent)}
.lbtn.p:hover{transform:translateY(-2px);box-shadow:0 12px 24px -8px color-mix(in srgb,var(--ink) 70%,transparent)}
.lbtn.g{background:var(--surface);color:var(--ink);border-color:color-mix(in srgb,var(--ink) 25%,var(--rule))}
.lbtn.g:hover{border-color:var(--ink);transform:translateY(-2px)}
.lbtn.sm{min-height:44px;padding:8px 20px;font-size:15px}
.lbtn:focus-visible,.l-links button:focus-visible,.l-brand:focus-visible,.l-scene button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.lbtn .ar{transition:transform .18s}.lbtn:hover .ar{transform:translateX(3px)}

/* hero */
.l-hero{position:relative;padding-block:40px 30px}
.l-hero::before{content:"";position:absolute;inset:-40px -10% auto -10%;height:720px;z-index:-1;
  background:radial-gradient(40% 50% at 18% 30%,var(--l-peach),transparent 70%),
             radial-gradient(38% 45% at 85% 20%,var(--l-sky),transparent 70%),
             radial-gradient(35% 40% at 60% 90%,var(--l-mint),transparent 70%);
  -webkit-mask-image:linear-gradient(180deg,#000 55%,transparent);mask-image:linear-gradient(180deg,#000 55%,transparent)}
.l-hero .lw.st{display:block}
.l-hero .lw{display:grid;grid-template-columns:1.05fr 1fr;gap:40px;align-items:center}
@media (max-width:860px){.l-hero .lw{grid-template-columns:1fr;gap:26px}}
.l-chip{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--ink);
  background:var(--surface);border:1px solid var(--rule);border-radius:999px;padding:6px 14px 6px 8px}
.l-chip i{width:10px;height:10px;border-radius:50%;background:var(--c-green);box-shadow:0 0 0 4px color-mix(in srgb,var(--c-green) 25%,transparent)}
.l-hero h1{font-family:"Nunito","Commissioner",sans-serif;font-weight:900;color:var(--ink);
  font-size:clamp(38px,6.4vw,66px);line-height:1.02;letter-spacing:-.02em;margin:18px 0 18px}
.l-hero h1 .hl{position:relative;white-space:nowrap}
.l-hero h1 .hl svg{position:absolute;left:-2%;bottom:-.14em;width:104%;height:.36em;z-index:-1}
.l-lead{font-size:clamp(18px,2.2vw,21px);line-height:1.55;color:var(--text);margin:0 0 28px;max-width:34em}
.l-pitch{font-size:17px;line-height:1.55;color:var(--text);margin:-14px 0 26px;max-width:32em;
  padding-left:16px;border-left:4px solid var(--c-yellow)}
.l-pills{list-style:none;display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 0;padding:0}
.l-pills li{font-size:13.5px;font-weight:600;color:var(--ink);background:var(--surface);
  border:1px solid var(--rule);border-radius:999px;padding:6px 14px;display:flex;align-items:center;gap:7px}
.l-pills li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c-green)}
.l-cta{display:flex;flex-wrap:wrap;gap:12px}
.l-small{margin:16px 0 0;font-size:15px;color:var(--muted)}
.l-small button{font:inherit;background:none;border:0;color:var(--accent);cursor:pointer;padding:4px 2px;text-decoration:underline;text-underline-offset:3px}

/* сцената */
.l-scene{position:relative;aspect-ratio:1/0.92;border-radius:44% 56% 48% 52% / 52% 44% 56% 48%;
  background:linear-gradient(180deg,var(--l-sky-1) 0%,var(--l-sky-2) 70%);box-shadow:inset 0 0 0 7px color-mix(in srgb,var(--surface) 85%,transparent),var(--l-shadow);overflow:hidden;
  max-width:560px;width:100%;justify-self:center}
.l-scene .hill{position:absolute;left:0;bottom:0;width:100%;height:34%}
.l-scene button{position:absolute;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
.l-scene button img{width:100%;height:auto;display:block;filter:drop-shadow(0 6px 6px rgba(0,0,0,.08))}
.l-scene .sdaisy{position:absolute;transform-origin:50% 100%;pointer-events:none;
  animation:lsway 4.6s ease-in-out infinite}
.l-scene .sdaisy.s1{animation-duration:5.8s;animation-delay:-1.4s}
.l-scene .sdaisy.s2{animation-duration:6.6s;animation-delay:-3s}
.l-scene .sdaisy img{width:100%;height:auto;display:block}
.l-scene .sway{transform-origin:50% 100%;animation:lsway 4.2s ease-in-out infinite}
.l-scene .sway img{transform-origin:50% 100%}
.l-scene .fly{animation:lfly 9s ease-in-out infinite}
@keyframes lsway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}
@keyframes lfly{0%{transform:translate(0,0) rotate(-4deg)}
  25%{transform:translate(38%,14%) rotate(5deg)}
  50%{transform:translate(72%,-6%) rotate(-3deg)}
  75%{transform:translate(30%,20%) rotate(6deg)}
  100%{transform:translate(0,0) rotate(-4deg)}}
.glowpulse .g1,.glowpulse .g2,.glowpulse .g3,.l-scene .fly .g1,.l-scene .fly .g2,.l-scene .fly .g3{
  animation:lglow 2.4s ease-in-out infinite}
.l-scene .fly .g2,.glowpulse .g2{animation-delay:-.3s}
.l-scene .fly .g3,.glowpulse .g3{animation-delay:-.6s}
@keyframes lglow{0%,100%{opacity:.25}50%{opacity:.9}}
.l-guides .ic img{animation:lsway 4.2s ease-in-out infinite;transform-origin:50% 100%}
.l-scene .fl{animation:lfloat 6s ease-in-out infinite}
.l-scene .fl.b{animation-duration:7.5s;animation-delay:-2s}
.l-scene .fl.c{animation-duration:5.2s;animation-delay:-3.5s}
@keyframes lfloat{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-10px) rotate(2deg)}}
.l-scene .spin img{animation:lspin 40s linear infinite}
@keyframes lspin{to{transform:rotate(360deg)}}
.l-scene button.wig img{animation:lwig .7s ease}
@keyframes lwig{0%,100%{transform:rotate(0) scale(1)}25%{transform:rotate(-10deg) scale(1.12)}50%{transform:rotate(8deg) scale(1.12)}75%{transform:rotate(-4deg) scale(1.05)}}
.l-bub{position:absolute;z-index:3;background:var(--surface);color:var(--ink);font-family:"Nunito",sans-serif;font-weight:800;
  font-size:20px;padding:6px 16px;border-radius:18px;box-shadow:var(--l-shadow);pointer-events:none;
  transform:translate(-50%,-100%);animation:lpop .25s ease-out;white-space:nowrap}
.l-bub::after{content:"";position:absolute;left:50%;bottom:-7px;width:14px;height:14px;background:inherit;transform:translateX(-50%) rotate(45deg);border-radius:3px}
@keyframes lpop{from{opacity:0;transform:translate(-50%,-80%) scale(.7)}to{opacity:1;transform:translate(-50%,-100%) scale(1)}}
.l-hint{text-align:center;font-size:14px;color:var(--muted);margin:12px 0 0}

/* числа */
.l-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:40px}
.l-stats div{background:var(--surface);border:1px solid var(--rule);border-radius:22px;padding:16px 18px;text-align:center}
.l-stats b{display:block;font-family:"Nunito",sans-serif;font-weight:900;font-size:clamp(28px,4vw,38px);color:var(--ink);line-height:1.1}
.l-stats span{font-size:14px;color:var(--muted)}
@media (max-width:640px){.l-stats{grid-template-columns:repeat(2,1fr)}}

/* секции */
.l-sec{padding-block:64px}
.l-sec.tint{background:var(--surface-2)}
.l-wave{display:block;width:100%;height:48px;color:var(--surface-2)}
.l-wave.dn{transform:scaleY(-1)}
.l-eyebrow{font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--c-red);margin:0 0 8px}
.l-sec h2{font-size:clamp(30px,4.4vw,44px);font-weight:900;color:var(--ink);line-height:1.1;margin:0 0 14px;letter-spacing:-.01em}
.l-sec .intro{font-size:18px;max-width:40em;margin:0 0 34px;color:var(--text)}
.l-grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.l-card{background:var(--surface);border:1px solid var(--rule);border-radius:28px;padding:24px 22px;
  transition:transform .2s ease, box-shadow .2s ease}
.l-card:hover{transform:translateY(-4px);box-shadow:var(--l-shadow)}
.l-card .ic{width:78px;height:78px;border-radius:24px;display:grid;place-items:center;margin-bottom:14px}
.l-card .ic img{width:60px;height:60px}
.l-card h3{font-size:21px;font-weight:800;color:var(--ink);margin:0 0 6px;line-height:1.25}
.l-card p{margin:0;font-size:16px;line-height:1.55}
.bg-peach{background:var(--l-peach)}.bg-mint{background:var(--l-mint)}.bg-sky{background:var(--l-sky)}
.bg-butter{background:var(--l-butter)}.bg-lilac{background:var(--l-lilac)}.bg-rose{background:var(--l-rose)}

/* картата */
.l-map{position:relative;aspect-ratio:100/58;border-radius:40px;margin-bottom:22px;
  background:radial-gradient(60% 70% at 20% 20%,var(--l-mint),transparent 70%),
             radial-gradient(60% 70% at 85% 30%,var(--l-sky),transparent 70%),
             radial-gradient(70% 70% at 50% 100%,var(--l-butter),transparent 70%),var(--surface);
  border:1px solid var(--rule);overflow:hidden}
@media (max-width:860px){.l-map{display:none}}
.l-map .mdaisy{position:absolute;transform:translate(-50%,-50%);opacity:.9}
.l-map .mdaisy img{width:100%;height:auto;display:block}
.l-map .mpath{position:absolute;inset:0;width:100%;height:100%}
.l-map .mp{position:absolute;transform:translate(-50%,-50%);width:170px;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:2px}
.l-map .mi{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;
  border:5px solid var(--surface);box-shadow:var(--l-shadow);margin-bottom:6px;transition:transform .25s ease}
.l-map .mp:hover .mi{transform:translateY(-5px) rotate(-4deg)}
.l-map .mi img{width:62px;height:62px}
.l-map .mp b{font-family:"Nunito",sans-serif;font-weight:800;font-size:16px;color:var(--ink);line-height:1.2}
.l-map .mg{font-size:12.5px;color:var(--muted)}
.l-map .soon{opacity:.62}
.l-map .soon .mi{border-style:dashed;border-color:var(--rule);box-shadow:none}
.l-area .ga{display:block;margin-top:10px;font-size:12px;font-weight:700;letter-spacing:.04em;
  text-transform:uppercase;color:var(--muted)}
.l-area.soon{opacity:.75;border:2px dashed var(--rule)}
.l-area.soon .n{background:var(--surface);color:var(--muted)}

/* водачите */
.l-guides{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:720px){.l-guides{grid-template-columns:1fr}}
.l-guides .ic svg{width:64px;height:64px}

/* области */
.l-areas{display:grid;gap:16px;grid-template-columns:repeat(4,1fr)}
@media (max-width:1100px){.l-areas{grid-template-columns:repeat(4,1fr)}}
@media (max-width:860px){.l-areas{grid-template-columns:repeat(3,1fr)}}
@media (max-width:640px){.l-areas{grid-template-columns:1fr 1fr}}
@media (max-width:380px){.l-areas{grid-template-columns:1fr}}
.l-area{border-radius:30px;padding:20px 18px 22px;text-align:center;position:relative;transition:transform .2s ease}
.l-area:hover{transform:translateY(-4px) rotate(-.6deg)}
.l-area img{width:96px;height:96px;margin:0 auto 8px;display:block;transition:transform .3s}
.l-area:hover img{transform:scale(1.08) rotate(-4deg)}
.l-area h3{margin:0;font-size:21px;font-weight:900;color:var(--ink)}
.l-area .n{display:inline-block;margin:6px 0 10px;font-size:13px;font-weight:700;color:var(--ink);
  background:color-mix(in srgb,var(--surface) 70%,transparent);border-radius:999px;padding:3px 12px}
.l-area p{margin:0;font-size:14.5px;line-height:1.5;color:var(--text)}

/* стъпки */
.l-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;counter-reset:st;position:relative}
.l-steps::before{content:"";position:absolute;top:34px;left:12%;right:12%;border-top:3px dashed var(--rule);z-index:0}
@media (max-width:780px){.l-steps{grid-template-columns:1fr}.l-steps::before{display:none}}
.l-step{position:relative;z-index:1;text-align:center;padding:0 8px}
.l-step .num{width:68px;height:68px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;
  font-family:"Nunito",sans-serif;font-weight:900;font-size:30px;color:var(--ink);border:4px solid var(--paper);box-shadow:var(--l-shadow)}
.l-step h3{font-size:20px;font-weight:800;color:var(--ink);margin:0 0 6px}
.l-step p{margin:0 auto;font-size:16px;max-width:22em}

/* за кого */
.l-who{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media (max-width:860px){.l-who{grid-template-columns:1fr}}
.l-who .l-card{padding-top:0;overflow:hidden}
.l-who .top{margin:0 -22px 18px;height:150px;display:flex;align-items:flex-end;justify-content:center;gap:4px}
.l-who .top img{height:136px;width:auto}
.l-who ul{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.l-who li{position:relative;padding-left:26px;font-size:15.5px;line-height:1.5}
.l-who li::before{content:"";position:absolute;left:4px;top:.5em;width:10px;height:10px;border-radius:50%;background:var(--c-orange)}

/* за нас */
.l-team{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:stretch}
@media (max-width:820px){.l-team{grid-template-columns:1fr}}
.l-person{background:var(--surface);border:1px solid var(--rule);border-radius:32px;padding:24px;height:100%;

.l-person .prole{margin:0 0 16px;font-size:12.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;

.l-person .pin{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:start}
.l-person .ptags{margin:0 0 10px;font-size:14px;font-weight:600;color:var(--muted)}

@media (max-width:460px){.l-person .pin{grid-template-columns:1fr;gap:14px}}

<script>
/* ============================================================
   Графична система — всички илюстрации се раждат тук.
   Един набор от примитиви + една палитра = гарантирана
   консистентност между всички картинки в сборника.
   ============================================================ */

/* Палитрата е взета от генерирания лист с героите, за да стоят
   нарисуваните фигури и качените картинки като едно цяло. */
const C = {
  red:"#F06018", orange:"#F0A030", yellow:"#F0C030", green:"#309060",
  blue:"#3060A8", purple:"#604890", pink:"#D86090", brown:"#784830",
  white:"#FFFFFF", ink:"#181818", skin:"#F5CBA3", skin2:"#E0AC80",
  hairDark:"#301818", hairLight:"#F0C868", grey:"#D8D8D8", leaf:"#309048"
};

const SW = 3.2;           // единна дебелина на контура
function svg(inner, vb="0 0 100 100", extra=""){
  return `<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg" ${extra}
    fill="none" stroke="${C.ink}" stroke-width="${SW}"
    stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
}
const f = (d, fill) => `<path d="${d}" fill="${fill}"/>`;
const circ = (cx,cy,r,fill) => `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${fill}"/>`;
const rect = (x,y,w,h,fill,r=2) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${fill}"/>`;
const line = (x1,y1,x2,y2) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
const ell = (cx,cy,rx,ry,fill) => `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${fill}"/>`;

/* ---------- ГЕРОИ ------------------------------------------
   Един генератор, параметризиран. Мартин, Ели, бебето и
   възрастните излизат от същия код — затова са разпознаваемо
   едно семейство, без ръчна работа за всеки кадър.
------------------------------------------------------------ */
function kid(o={}){
  const p = Object.assign({
    hair:"short", hairCol:C.hairDark, shirt:C.yellow, pants:C.blue,
    skin:C.skin, scale:1, dy:0, arms:"down", baby:false, skirt:false,
    mouth:"smile", extra:""
  }, o);

  const s = p.baby ? 0.72 : p.scale;
  const headR = p.baby ? 15 : 13;
  const hy = p.baby ? 30 : 26;          // център на главата
  const by = hy + headR + 3;            // начало на тялото

  let hair = "";
  if(p.hair==="short")
    hair = f(`M ${50-headR-1} ${hy-2} a ${headR+1} ${headR+1} 0 0 1 ${2*headR+2} 0 q -${headR} -9 -${2*headR+2} 0 z`, p.hairCol);
  if(p.hair==="braids")
    hair = f(`M ${50-headR-1} ${hy-1} a ${headR+1} ${headR+1} 0 0 1 ${2*headR+2} 0 q -${headR} -10 -${2*headR+2} 0 z`, p.hairCol)
         + ell(50-headR-3, hy+9, 4.5, 8, p.hairCol)
         + ell(50+headR+3, hy+9, 4.5, 8, p.hairCol);
  if(p.hair==="curl")
    hair = circ(50-8, hy-10, 6, p.hairCol)+circ(50, hy-13, 6.5, p.hairCol)+circ(50+8, hy-10, 6, p.hairCol);
  if(p.hair==="bun")
    hair = f(`M ${50-headR-1} ${hy} a ${headR+1} ${headR+1} 0 0 1 ${2*headR+2} 0 q -${headR} -11 -${2*headR+2} 0 z`, p.hairCol)
         + circ(50, hy-headR-5, 6, p.hairCol);

  const body = p.skirt
    ? f(`M 40 ${by} L 60 ${by} L 66 ${by+26} L 34 ${by+26} Z`, p.shirt)
    : rect(39, by, 22, 25, p.shirt, 4);

  let arms;
  if(p.arms==="up")
    arms = `<path d="M 40 ${by+5} L 30 ${by-8}"/><path d="M 60 ${by+5} L 70 ${by-8}"/>`;
  else if(p.arms==="toFace")
    arms = `<path d="M 40 ${by+5} L 33 ${by+18}"/><path d="M 60 ${by+5} L 56 ${hy+6}"/>`;
  else if(p.arms==="down2")
    arms = `<path d="M 40 ${by+5} L 33 ${by+20}"/><path d="M 60 ${by+5} L 67 ${by+20}"/>`;
  else
    arms = `<path d="M 40 ${by+5} L 34 ${by+21}"/><path d="M 60 ${by+5} L 66 ${by+21}"/>`;

  const legs = p.skirt
    ? `<path d="M 45 ${by+26} L 44 ${by+42}"/><path d="M 55 ${by+26} L 56 ${by+42}"/>`
    : rect(40, by+25, 8, 18, p.pants, 2) + rect(52, by+25, 8, 18, p.pants, 2);

  const mouth = p.mouth==="smile"
    ? `<path d="M ${50-5} ${hy+5} q 5 5 10 0"/>`
    : `<path d="M ${50-4} ${hy+6} L ${50+4} ${hy+6}"/>`;

  return svg(
    legs + arms + body +
    circ(50, hy, headR, p.skin) + hair +
    circ(50-5, hy-2, 1.8, C.ink) + circ(50+5, hy-2, 1.8, C.ink) + mouth +
    p.extra,
    "0 0 100 100"
  ).replace("<svg ", `<svg style="--s:${s}" `);
}

const MARTIN = o => kid(Object.assign({hair:"short", hairCol:C.brown, shirt:C.yellow, pants:C.blue}, o));
const ELI    = o => kid(Object.assign({hair:"braids", hairCol:C.hairDark, shirt:C.green, skirt:true}, o));
const BABY   = o => kid(Object.assign({hair:"curl", hairCol:C.hairLight, shirt:C.orange, pants:C.orange, baby:true}, o));
const MAMA   = o => kid(Object.assign({hair:"bun", hairCol:C.hairDark, shirt:C.purple, skirt:true, scale:1.15}, o));

/* ---------- ПРЕДМЕТИ --------------------------------------- */
const ART = {};

ART.brush = () => svg(
  rect(20,52,52,9,C.blue,4) + rect(66,49,16,15,C.white,3) +
  line(70,52,70,61)+line(75,52,75,61)+line(79,52,79,61)
);
ART.brushPaste = () => svg(
  rect(20,52,52,9,C.blue,4) + rect(66,49,16,15,C.white,3) +
  line(70,52,70,61)+line(75,52,75,61)+line(79,52,79,61) +
  f("M 63 48 q 10 -13 22 -3 q -11 -4 -22 3 z", C.green)
);
/* момче с четка до устата */
ART.brushing = () => MARTIN({arms:"toFace", extra:
  `<g transform="rotate(-28 62 32)">` +
    rect(60,29,24,6,C.blue,3) + rect(80,26,11,11,C.white,2) +
  `</g>`});
/* момче, което изплаква устата с чаша */

ART.grid = (cells, size=4) => {
  const g = 84/size; let s = rect(8,8,84,84,C.white,2);
  for(let i=1;i<size;i++){ s+=line(8+i*g,8,8+i*g,92)+line(8,8+i*g,92,8+i*g); }
  cells.forEach(c=>{
    const cx = 8+(c.x+0.5)*g, cy = 8+(c.y+0.5)*g, r=g*0.28;
    if(c.s==="o") s+=circ(cx,cy,r,c.f||C.white);
    if(c.s==="d") s+=f(`M ${cx} ${cy-r} L ${cx+r} ${cy} L ${cx} ${cy+r} L ${cx-r} ${cy} Z`, c.f||C.white);
    if(c.s==="t") s+=f(`M ${cx} ${cy-r} L ${cx+r} ${cy+r} L ${cx-r} ${cy+r} Z`, c.f||C.white);
  });
  return svg(s);
};

/* ---------- Къщичка с признаци --------------------------------
   Ръкописът (…13010, стр. 2 и 12) сменя покрива, прозорците и
   вратата поотделно. Затова къщата е генератор, не картинка:
   roof "plain" | "check" | "stripe" ; win 0|1|2 ; door "arch" | "rect".
--------------------------------------------------------------- */
ART.house3 = (o={}) => {
  const p = Object.assign({roof:"plain", win:2, door:"rect"}, o);
  /* всяка къща си носи собствено id на шарката — иначе всички покриви
     в едно упражнение взимат шарката на първия нарисуван */
  const id = "hr" + (ART.house3._n = (ART.house3._n||0) + 1);
  const pat = p.roof==="plain" ? "" :
    `<defs><pattern id="${id}" width="8" height="8" patternUnits="userSpaceOnUse">
       <rect width="8" height="8" fill="${C.red}"/>
       <path d="${p.roof==="check" ? "M0 0 H8 M0 0 V8" : "M0 0 V8"}"
         stroke="${C.ink}" stroke-width="1.3"/></pattern></defs>`;
  const roofFill = p.roof==="plain" ? C.red : `url(#${id})`;
  const wins = p.win===0 ? ""
    : p.win===1 ? rect(43,58,14,14,C.blue,1) + line(50,58,50,72) + line(43,65,57,65)
    : rect(24,58,14,14,C.blue,1) + line(31,58,31,72) + line(24,65,38,65)
      + rect(62,58,14,14,C.blue,1) + line(69,58,69,72) + line(62,65,76,65);
  const door = p.door==="arch"
    ? f("M42 92 V82 a8 8 0 0 1 16 0 V92 Z", C.brown)
    : rect(42,76,16,16,C.brown,1);
  return svg(pat
    + rect(20,52,60,40,C.white,2)
    + f("M14 52 L50 24 L86 52 Z", roofFill)
    + wins + door);
};

/* Оградка с променлив брой колчета (…13010, стр. 2, ред 2).
   Колчетата са отделни дъсчици с връх, вързани с две напречни летви —
   така се броят колчета, а не квадратчета. */
ART.fence = n => {
  const x0 = 10, x1 = 90, step = (x1 - x0) / n;
  let s = "";
  for(let i=0;i<n;i++){
    const x = x0 + step*i + step*0.28, w = step*0.44;
    s += f(`M${x} 88 V44 L${x+w/2} 34 L${x+w} 44 V88 Z`, C.brown);
  }
  s += rect(8,52,84,6,C.brown,1) + rect(8,72,84,6,C.brown,1);
  return svg(s);
};

   dir: "hor" | "ver" | "diagA" (от долу-ляво нагоре) | "diagB". */

  const rule = dir==="hor"  ? `left:0;top:50%;width:100%;height:2px`
             : dir==="ver"  ? `left:50%;top:0;width:2px;height:100%`
             : `left:-16%;top:50%;width:132%;height:2px;transform:rotate(${dir==="diagA"?-45:45}deg)`;
  const P = { hor:[[28,6],[28,56]], ver:[[6,30],[56,30]],
              diagA:[[52,8],[8,54]], diagB:[[8,8],[52,54]] }[dir];
  return `<span style="${box}">
    <span style="position:absolute;${rule};background:var(--ink);opacity:.5"></span>
    <span style="position:absolute;left:${P[0][0]}%;top:${P[0][1]}%;width:38px">${ART[a]()}</span>
    <span style="position:absolute;left:${P[1][0]}%;top:${P[1][1]}%;width:38px">${ART[b]()}</span>
  </span>`;
};

/* Квадрат, разделен по диагонал, с разпръснати фигурки от двете
   страни (…13300, стр. 39 и 43). na/nb — брой горе-дясно / долу-ляво. */
ART.halfBox = (item, na, nb) => {
  const spot = (i, half) => {
    /* детерминирано разбъркване вътре в съответния триъгълник */
    const u = ((i*37)%17)/17, v = ((i*53)%13)/13;
    let x = 8 + u*72, y = 8 + v*72;
    if(half==="a"){ if(y > x-6) { const t=x; x=y+10; y=t-10 } }      /* горе-дясно */
    else          { if(y < x+6) { const t=x; x=y-10; y=t+10 } }      /* долу-ляво */
    return [Math.max(6,Math.min(80,x)), Math.max(6,Math.min(80,y))];
  };
  const put = (n, half) => Array.from({length:n},(_,i)=>{
    const [x,y] = spot(i + (half==="a"?0:7), half);
    return `<span style="position:absolute;left:${x}%;top:${y}%;width:28px">${ART[item]()}</span>`;
  }).join("");
  return `<span style="position:relative;display:block;width:190px;height:190px;
    border:2px solid var(--rule);border-radius:10px;background:var(--surface);overflow:hidden">
    <span style="position:absolute;left:-19%;top:50%;width:138%;height:2px;
      background:var(--rule);transform:rotate(-45deg)"></span>
    ${put(na,"a")}${put(nb,"b")}</span>`;
};

--------------------------------------------------------------- */

  const P = {

    "лява-горе":   {ra:"M40 46 L28 62", la:"M60 46 L74 22", rl:"M45 70 L42 90", ll:"M55 70 L58 90"},
    "на-кръста":   {ra:"M40 46 L30 54 L40 60", la:"M60 46 L70 54 L60 60", rl:"M45 70 L42 90", ll:"M55 70 L58 90"},
    "крак-напред": {ra:"M40 46 L22 44", la:"M60 46 L78 44", rl:"M45 70 L26 86", ll:"M55 70 L58 90"}

  const none = (h == null);            /* без стрелка — за „какво липсва“ */
  const a=((h||12)%12)*30-90, r=18;
  const x=50+r*Math.cos(a*Math.PI/180), y=50+r*Math.sin(a*Math.PI/180);
  let ticks="";
  for(let i=0;i<12;i++){
    const t=i*30-90, c=Math.cos(t*Math.PI/180), s=Math.sin(t*Math.PI/180);
    ticks+=`<line x1="${50+38*c}" y1="${50+38*s}" x2="${50+34*c}" y2="${50+34*s}" stroke-width="2.4"/>`;
    ticks+=`<text x="${50+27*c}" y="${50+27*s}" text-anchor="middle" dominant-baseline="central"
      font-family="Literata,serif" font-size="11" fill="${C.ink}" stroke="none">${i===0?12:i}</text>`;
  }
  return svg(circ(50,50,42,C.white)+ticks+
    (none?"":`<line x1="50" y1="50" x2="${x}" y2="${y}" stroke-width="4.5"/>`)+
    circ(50,50,4,C.ink));
};

function makeCode(res){
  const d=res.map(v=>Math.min(9,v||0)).join("");
  return res.length.toString(36).toUpperCase()+"-"+parseInt(d,10).toString(36).toUpperCase();
}
function readCode(code){
  const m=/^([0-9A-Z])-([0-9A-Z]+)$/.exec((code||"").trim().toUpperCase());
  if(!m) return null;
  const n=parseInt(m[1],36), d=parseInt(m[2],36);
  if(!n||isNaN(d)) return null;
  return String(d).padStart(n,"0").split("").map(Number);
}

/* =========================== СПИСЪК =========================== */
let filter="Всички", fAge="Всички възрасти", q="";

/* Търсенето гледа заглавието, инструкцията, подтипа, областта, бележката
   за логопеда и източника — за да може да се търси и „стр. 25“. */
const norm = t => (t||"").toLowerCase().replace(/ё/g,"е");
const hay = e => norm([e.title,e.instr,e.m,e.g,e.hint,e.note,e.src].join(" "));
/* Българският мени окончанията: „предлог“ трябва да намира и „предлози“.
   Затова освен самата дума се пробват и тя без последната буква и без две. */
const stems = t => { const a=[t];
  if(/[^а-яa-z]/.test(t)) return a;      /* има цифра, точка или интервал — търси се буквално */
  if(t.length>=5) a.push(t.slice(0,-1));
  if(t.length>=6) a.push(t.slice(0,-2));
  return a };
const qhit = e => { if(!q) return true; const h=hay(e); return stems(q).some(x=>h.includes(x)) };
const match=e=>(filter==="Всички"||e.g===filter)&&(fAge==="Всички възрасти"||e.age===fAge)&&qhit(e);

/* подчертава намереното в текста на картата */
const mark_=(t,s)=>{
  if(!s) return t;
  const n=norm(t);
  for(const x of stems(s)){
    const i=n.indexOf(x);
    if(i>=0) return t.slice(0,i)+'<mark class="hit">'+t.slice(i,i+x.length)+'</mark>'+t.slice(i+x.length);
  }
  return t;
};

   (home?"":`<div class="panel"><h3>За логопеда</h3>${e.note?`<p>${e.note}</p>`:""}
   <p class="src">Източник: ${e.src} · механика <code>${e.t}</code> ·
   възраст <strong>${e.age} г.</strong> — предложена, не е от ръкописа</p></div>`);
  if(!home) d.querySelector(".back").onclick=back;
  R[e.t](e); scrollTo(0,0);
}
function back(){
  document.getElementById("detail").hidden=true;
  document.getElementById("list").hidden=false;
  modebar(); tabs(); search(); cards();
}
const stage=()=>document.getElementById("stage");
const fb=(t,k)=>{const n=document.getElementById("fb");if(!n)return;
  n.textContent=t;n.dataset.k=k||"";
  if(run&&k==="no") run.att[run.i]=(run.att[run.i]||0)+1};
function ctl(b){const c=document.getElementById("ctl");
  c.innerHTML=b.map(x=>`<button class="btn ${x.g?"ghost":""}" type="button">${x.t}</button>`).join("");
  [...c.children].forEach((n,i)=>n.onclick=b[i].fn)}
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=0|Math.random()*(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};

/* =========================== ДОМАШНА РАБОТА =========================== */
function startRun(ids){
  MODE="home";
  run={ids, i:0, att:ids.map(()=>0), res:ids.map(()=>0)};
  document.getElementById("eyebrow").textContent="Домашна работа";
  document.getElementById("h1").textContent="Да поиграем!";
  document.getElementById("hstat").hidden=true;
  document.getElementById("list").hidden=true;
  open_(ids[0]);
}
function nextTask(){
  if(!run) return;
  run.i++;

}
function finish(){
  const code=makeCode(run.res), n=run.res.filter(v=>v>0).length;
  const d=document.getElementById("detail");
  d.innerHTML=`<div class="done-screen">
    <div class="stars">${[0,1,2].map(()=>ART.star(C.yellow)).join("")}</div>
    <h2>Браво!</h2>

    <div class="bigcode">${code}</div>
    <div class="controls"><button class="btn ghost" type="button" id="again">Още веднъж</button></div>
  </div>`;

/* ---- 14. превоз през реката --------------------------------
   Ръкописът (…12220, стр. 22) дава приказката за агнето, вълка
   и сеното с празни квадратчета за всяка стъпка. Тук стъпките
   се правят наистина: лодката носи само един пътник, а щом
   лодкарят се отдалечи, оставените на брега се изяждат.
   Грешката не се наказва с „не е вярно“ — детето вижда какво
   се е случило и започва отново.
------------------------------------------------------------- */
R.ferry=e=>{
  let side, load, over;
  const reset=()=>{ side={man:0}; e.cargo.forEach(c=>side[c.k]=0); load=null; over=""; };
  const trouble=()=>{
    for(const r of e.rules)
      if(side[r.a]===side[r.b] && side[r.a]!==side.man) return r.msg;
    return "";
  };
  const won=()=>e.cargo.every(c=>side[c.k]===1) && side.man===1;

  const draw=()=>{
    const bank=s=>`<div class="bank">`+
      e.cargo.filter(c=>side[c.k]===s && load!==c.k).map(c=>
        `<button class="fitem" type="button" data-k="${c.k}"
          ${over?"disabled":""}>${ART[c.art]()}<span class="lbl">${c.l}</span></button>`).join("")+
      (side.man===s?`<button class="fitem man" type="button" disabled>${ART[e.man]()}
         <span class="lbl">${e.manLabel}</span></button>`:"")+`</div>`;

    const cargo = load ? (()=>{const c=e.cargo.find(x=>x.k===load);
      return `<button class="fitem" type="button" data-k="${load}">${ART[c.art]()}
        <span class="lbl">${c.l}</span></button>`})() : `<span class="fempty">празна</span>`;

    stage().innerHTML=`<div class="ferry">
        ${bank(0)}
        <div class="river" data-man="${side.man}">
          <div class="boat">${cargo}<span class="hull">${ART.boat()}</span></div>
        </div>
        ${bank(1)}
      </div>`+
      (over?"":`<div class="pad" style="margin-top:20px">
        <button class="key wide" type="button" id="sail">
          ${side.man===0?"Отплавай надясно →":"← Върни се наляво"}</button></div>`);

    stage().querySelectorAll(".fitem[data-k]").forEach(n=>n.onclick=()=>{
      const k=n.dataset.k;
      if(load===k){ load=null; draw(); fb(""); return }         /* свали от лодката */
      if(side[k]!==side.man){ fb("Този е на другия бряг. Лодкарят не може да го вземе оттук.","no"); return }
      load=k; draw(); fb("");
    });
    const s=document.getElementById("sail");
    if(s) s.onclick=()=>{
      side.man=1-side.man;
      if(load){ side[load]=side.man; load=null }
      const t=trouble();
      if(t){ over="no"; draw(); fb(t+" Опитай пак — лодкарят не бива да ги оставя заедно.","no"); return }
      if(won()){ over="ok"; draw(); fb("Всички минаха на другия бряг!","ok"); mark(e.id); return }
      draw(); fb("");
    };
  };
  reset(); draw();
  ctl([{t:"Отначало",g:1,fn:()=>{reset();draw();fb("")}}]);
};


/* ---- 15. матрици по принципа на Рейвън --------------------------
   ОРИГИНАЛНИ задачи, построени по същите правила като прогресивните
   матрици: постоянно по ред, расте по брой, расте по размер, „по едно
   от трите“ в ред и колона, завъртане. НЕ са задачи от теста на Рейвън
   и не дават норма — това е упражнение, не диагностика.
   Всяка клетка е описание {sh, col, n, sz, rot, full}; генераторът е
   детерминиран, за да е една и съща задача при всяко отваряне
   (домашните се пазят по номер на задача).
------------------------------------------------------------------ */
const RV = {
  col: {red:"#E4572E", blue:"#2E7CC4", green:"#3FA66B", yellow:"#F2C12E", purple:"#7E57C2", ink:"#2A2620"},
  shape(sh, cx, cy, r, fill, rot){
    const t = `transform="rotate(${rot||0} ${cx} ${cy})"`;
    const st = `fill="${fill}" stroke="#181818" stroke-width="2.6" stroke-linejoin="round"`;
    const P = (pts)=>`<polygon points="${pts.map(([x,y])=>`${cx+x*r},${cy+y*r}`).join(" ")}" ${st} ${t}/>`;
    switch(sh){
      case "circle":   return `<circle cx="${cx}" cy="${cy}" r="${r*.92}" ${st}/>`;
      case "square":   return P([[-.82,-.82],[.82,-.82],[.82,.82],[-.82,.82]]);
      case "triangle": return P([[0,-.95],[.95,.8],[-.95,.8]]);
      case "diamond":  return P([[0,-1],[.78,0],[0,1],[-.78,0]]);
      case "star":     return P(Array.from({length:10},(_,i)=>{const a=-Math.PI/2+i*Math.PI/5,k=i%2?.42:1;return[Math.cos(a)*k,Math.sin(a)*k]}));
      case "arrow":    return P([[0,-1],[.7,-.15],[.28,-.15],[.28,.95],[-.28,.95],[-.28,-.15],[-.7,-.15]]);
    }
    return "";
  },
  cell(c){
    const n=c.n||1, sz=c.sz||1;
    const fill = c.full===false ? "#FFFFFF" : RV.col[c.col||"blue"];
    const r = (n===1?30:n===2?20:15)*sz;
    const xs = n===1?[50]:n===2?[30,70]:[20,50,80];
    return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">`+
      xs.map(x=>RV.shape(c.sh,x,50,r,fill,c.rot)).join("")+`</svg>`;
  },
  key:c=>[c.sh,c.col,c.n||1,c.sz||1,c.rot||0,c.full===false?0:1].join("|"),
  /* детерминиран генератор на случайни числа — задачата е една и съща винаги */
  rng(seed){ let s=seed>>>0||1; return ()=>((s=Math.imul(s^s>>>15,1|s)+0x6D2B79F5)>>>0)/4294967296 },
  /* правдоподобни грешни отговори: всеки сменя само ЕДИН признак на верния */
  distract(ans, pool, rand){
    const out=[], seen=new Set([RV.key(ans)]);
    const tries=[
      c=>({...c, sh:pool.sh.filter(x=>x!==c.sh)[Math.floor(rand()*(pool.sh.length-1))]}),
      c=>({...c, col:pool.col.filter(x=>x!==c.col)[Math.floor(rand()*(pool.col.length-1))]}),
      c=>({...c, n:[1,2,3].filter(x=>x!==(c.n||1))[Math.floor(rand()*2)]}),
      c=>({...c, sz:[.55,.78,1].filter(x=>x!==(c.sz||1))[Math.floor(rand()*2)]}),
      c=>({...c, rot:((c.rot||0)+[90,180,270][Math.floor(rand()*3)])%360}),
      c=>({...c, full:c.full===false})
    ];
    let guard=0;
    while(out.length<5 && guard++<200){
      const f=tries[Math.floor(rand()*tries.length)];
      if(f===tries[4] && ans.sh!=="arrow") continue;     /* кръг, завъртян, е същият кръг */
      const d=f(ans), k=RV.key(d);
      if(!seen.has(k)){ seen.add(k); out.push(d) }
    }
    return out;
  }
};

R.raven=e=>{
  const rand=RV.rng(e.seed);
  const ans=e.grid[2][2];
  const opts=[ans,...RV.distract(ans,e.pool,rand)];
  for(let i=opts.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]]}
  const correct=opts.findIndex(o=>RV.key(o)===RV.key(ans));
  const draw=(solved)=>{
    stage().innerHTML=`<div class="gridbox"><div class="gr rv" style="grid-template-columns:repeat(3,auto)">`+
      e.grid.flat().map((c,i)=>`<div class="gc fixed">${i===8&&!solved
        ?'<span class="qmark" style="font-size:34px;min-height:0">?</span>':RV.cell(c)}</div>`).join("")+
      `</div></div><div class="row" style="margin-top:22px">`+
      opts.map((o,i)=>`<button class="item sm" type="button" data-i="${i}">${RV.cell(o)}</button>`).join("")+`</div>`;
    stage().querySelectorAll(".item").forEach(n=>n.onclick=()=>{
      const i=+n.dataset.i;
      if(i===correct){draw(true);
        stage().querySelector(`.item[data-i="${i}"]`).dataset.state="ok";fb("Точно! Мястото е попълнено.","ok");mark(e.id)}
      else{n.dataset.state="no";fb("Не е тази. Гледай какво се мени в реда — и какво в колоната.","no")}});
  };
  draw(false); ctl([{t:"Отначало",g:1,fn:()=>{draw(false);fb("")}}]);
};

/* ---- 3. избор на няколко ---- */
R.pickmany=e=>{
  let p=new Set();
  const draw=()=>{
    /* oneRow: редицата не бива да се пренася на два реда — ритъмът „всяка трета“
       се чете само ако рибките са в един ред. Затова се свиват и се плъзгат. */
    const rowSt=e.oneRow?' style="flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start"':"";
    const itSt=e.oneRow?' style="flex:0 0 auto;width:64px;min-width:0;padding:5px"':"";
    stage().innerHTML=(e.lead?`<div class="row lead">${e.lead()}</div>`:"")+
      `<div class="row"${rowSt}>`+e.items.map((it,i)=>
      `<button class="item" type="button" data-i="${i}"${itSt} ${p.has(i)?'data-state="sel"':''}>
       ${it.a()}${it.l?`<span class="lbl">${it.l}</span>`:""}</button>`).join("")+`</div>`;
    stage().querySelectorAll(".item").forEach(n=>n.onclick=()=>{
      const i=+n.dataset.i; p.has(i)?p.delete(i):p.add(i); draw(); fb("")});
  };
  draw();
  ctl([{t:"Провери",fn:()=>{
      if(e.howMany!=null){                    /* важен е броят, не кои точно */
        const ok=p.size===e.howMany;
        stage().querySelectorAll(".item").forEach((n,i)=>{if(p.has(i))n.dataset.state=ok?"ok":"no"});
        ok?(fb("Точно толкова!","ok"),mark(e.id))
          :fb(p.size<e.howMany?"Малко са. Огради още едно.":"Много са. Махни едно.","no");
        return;
      }
      const w=new Set(e.correct), ok=p.size===w.size&&[...p].every(i=>w.has(i));
      stage().querySelectorAll(".item").forEach((n,i)=>{if(p.has(i))n.dataset.state=w.has(i)?"ok":"no"});
      ok?(fb("Точно!","ok"),mark(e.id)):fb("Погледни пак.","no")}},
    {t:"Отначало",g:1,fn:()=>{p=new Set();draw();fb("")}}]);
};

/* ---- 4. свързване по двойки ---- */
R.pairs=e=>{
  let sel=null, done_=[];
  const col=(arr,s)=>arr.map((it,i)=>{
    const m=done_.some(p=>p[s]===i);
    return `<button class="item" type="button" data-s="${s}" data-i="${i}"
      ${m?'data-state="ok"':(sel&&sel.s===s&&sel.i===i?'data-state="sel"':'')} ${m?"disabled":""}>
      ${it.a()}${it.l?`<span class="lbl">${it.l}</span>`:""}</button>`}).join("");
  const draw=()=>{
    stage().innerHTML=`<div class="row" style="margin-bottom:16px">${col(e.left,0)}</div>
      <div class="row">${col(e.right,1)}</div>`;
    stage().querySelectorAll(".item:not([disabled])").forEach(n=>n.onclick=()=>{
      const s=+n.dataset.s,i=+n.dataset.i;
      if(!sel||sel.s===s){sel={s,i};draw();return}
      const pr=s===1?[sel.i,i]:[i,sel.i];
      const ok=e.anyPair||e.pairs.some(p=>p[0]===pr[0]&&p[1]===pr[1]);
      if(ok){done_.push({0:pr[0],1:pr[1]});sel=null;draw();
        done_.length===e.left.length?(fb("Всички двойки са намерени!","ok"),mark(e.id)):fb("Вярно.","ok")}
      else{sel=null;draw();fb("Тези двамата не си отиват. Опитай пак.","no")}});
  };
  draw(); ctl([{t:"Отначало",g:1,fn:()=>{sel=null;done_=[];draw();fb("")}}]);
};

/* ---- 6. мрежа: копиране и симетрия ---- */
R.gridcopy=e=>{
  const N=3; let target=e.src_grid.map(r=>r.map(()=>null)), pick=null;
  const want=e.mirror
    ? e.src_grid.map(r=>r.slice().reverse())
    : e.src_grid;
  const cell=(s,cls,r,c)=>`<div class="gc ${cls}" ${cls?"":`data-r="${r}" data-c="${c}"`}>${s?SHAPE[s]():""}</div>`;
  const draw=()=>{
    stage().innerHTML=`<div class="gridbox">
      <div class="gr" style="grid-template-columns:repeat(${N},auto)">`+
        e.src_grid.map((r,ri)=>r.map(s=>cell(s,"fixed",ri,0)).join("")).join("")+`</div>`+
      (e.mirror?`<div class="mirrorline"></div>`:`<span class="arrowto">→</span>`)+
      `<div class="gr" style="grid-template-columns:repeat(${N},auto)">`+
        target.map((r,ri)=>r.map((s,ci)=>cell(s,"",ri,ci)).join("")).join("")+`</div>
      </div>
      <div class="row" style="margin-top:22px">`+
      e.opts.map((s,i)=>`<button class="item sm" type="button" data-o="${i}" ${pick===i?'data-state="sel"':''}>
        ${SHAPE[s]()}</button>`).join("")+
      `<button class="item sm" type="button" data-o="-1" ${pick===-1?'data-state="sel"':''}>
        <span class="lbl" style="font-size:28px">✕</span><span class="lbl">изтрий</span></button></div>`;
    stage().querySelectorAll("[data-o]").forEach(n=>n.onclick=()=>{pick=+n.dataset.o;draw()});
    stage().querySelectorAll(".gc[data-r]").forEach(n=>n.onclick=()=>{
      if(pick===null){fb("Първо избери фигура отдолу.","no");return}
      target[+n.dataset.r][+n.dataset.c] = pick===-1?null:e.opts[pick];
      draw(); fb("")});
  };
  draw();
  ctl([{t:"Провери",fn:()=>{
      const ok=target.every((r,ri)=>r.every((s,ci)=>s===want[ri][ci]));
      stage().querySelectorAll(".gc[data-r]").forEach(n=>{
        const r=+n.dataset.r,c=+n.dataset.c;
        if(target[r][c]||want[r][c]) n.dataset.state=target[r][c]===want[r][c]?"ok":"no"});
      ok?(fb("Съвсем точно!","ok"),mark(e.id)):fb("Някои фигури не са на място.","no")}},
    {t:"Изчисти",g:1,fn:()=>{target=e.src_grid.map(r=>r.map(()=>null));pick=null;draw();fb("")}}]);
};

/* ---- 7. преброй и запиши ---- */
R.count=e=>{
  /* разпръснато подреждане: същият брой, но без опора на редицата */
  const scatter=()=>{
    const cols=Math.ceil(Math.sqrt(e.n)), rows=Math.ceil(e.n/cols), H=rows*94+40;
    return `<div style="position:relative;height:${H}px;max-width:440px;margin:0 auto">`+
      Array.from({length:e.n},(_,i)=>{
        const r=Math.floor(i/cols), c=i%cols;
        const jx=((i*37)%23)/23-.5, jy=((i*53)%19)/19-.5;   /* разбъркване, но винаги едно и също */
        const x=(c+.5)/cols*100+jx*11, y=(r+.5)/rows*100+jy*16;
        return `<span style="position:absolute;left:${x}%;top:${y}%;width:64px;margin:-32px 0 0 -32px">
          ${e.item()}</span>`}).join("")+`</div>`;
  };
  const draw=()=>{
    stage().innerHTML=(e.fig?`<div class="countrow" style="padding:24px">
        <span style="width:200px;display:block">${e.fig()
          .replace("<svg ","<svg style=\"width:200px;height:200px\" ")}</span></div>`
      :e.scatter?scatter():`<div class="countrow">`+
      Array.from({length:e.n},()=>e.item()).join("")+`</div>`)+`
      <div class="pad">`+Array.from({length:10},(_,i)=>
      `<button class="key" type="button" data-n="${i+1}">${i+1}</button>`).join("")+`</div>`;
    stage().querySelectorAll(".key").forEach(n=>n.onclick=()=>{
      const v=+n.dataset.n;

/* ---- 9. оцвети по цифра ---- */
R.colorcode=e=>{
  let pick=null, fill=e.bands.map(()=>null);
  const draw=()=>{
    const W=320,H=210, n=e.bands.length;
    const arcs=e.bands.map((b,i)=>{
      const r0=150-i*26, r1=r0-22;
      return `<path d="M ${160-r0} 200 A ${r0} ${r0} 0 0 1 ${160+r0} 200 L ${160+r1} 200
        A ${r1} ${r1} 0 0 0 ${160-r1} 200 Z" fill="${fill[i]||"var(--surface-2)"}"
        stroke="#2B2B2B" stroke-width="2.5" data-b="${i}" style="cursor:pointer"/>
        <text x="160" y="${200-r0+16}" text-anchor="middle" font-size="15"
        font-family="Literata,serif" fill="#2B2B2B" pointer-events="none">${b}</text>`;
    }).join("");
    stage().innerHTML=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:400px;display:block;margin:0 auto;touch-action:manipulation">${arcs}</svg>
      <div class="swatches">`+e.legend.map((L,i)=>
      `<button class="sw" type="button" data-c="${i}" style="background:${L.c}"
        ${pick===i?'data-state="sel"':''}><span>${L.n}</span></button>`).join("")+`</div>`;
    stage().querySelectorAll(".sw").forEach(n=>n.onclick=()=>{pick=+n.dataset.c;draw()});
    stage().querySelectorAll("[data-b]").forEach(n=>n.onclick=()=>{
      if(pick===null){fb("Първо избери цвят.","no");return}
      fill[+n.dataset.b]=e.legend[pick].c; draw(); fb("")});
  };
  draw();
  ctl([{t:"Провери",fn:()=>{
      const ok=e.bands.every((b,i)=>fill[i]===e.legend.find(L=>L.n===b).c);
      ok?(fb("Получи се дъга!","ok"),mark(e.id)):fb("Някой цвят не е на своето число.","no")}},
    {t:"Изчисти",g:1,fn:()=>{fill=e.bands.map(()=>null);pick=null;draw();fb("")}}]);
};

/* ---- 13. предлози: детето само поставя предмета ----------------
   Механиката е различна от „посочи картинката“: тук няма какво да се
   отгатне по изключване. Детето избира дума и предметът отива точно
   там — грешката се вижда, защото предметът застава на грешно място.
------------------------------------------------------------------ */
/* Геометрията е различна за всяка мебел: плотът на масата е високо,
   седалката на стола по-ниско, дъното на кутията още по-ниско.
   Затова всяко място се задава спрямо конкретната мебел. */
const CGEO = {
  table2:   {"на":"46%", "под":"10%", "зад":"30%"},
  chair2:   {"на":"34%", "под":"10%", "зад":"26%"},
  bed2:     {"на":"30%", "под":"9%",  "зад":"24%"},
  cupboard: {"на":"40%", "под":"10%", "зад":"24%"},
  cardbox:  {"на":"36%", "в":"30%",   "зад":"22%"},
  basket:   {"на":"36%", "в":"32%",   "зад":"22%"}
};
const placePos = (cont, s) => {
  const g = CGEO[cont] || {};
  if(s==="старт") return "left:3%;bottom:6%;z-index:3";
  if(s==="до")    return "right:3%;bottom:6%;z-index:3";
  if(s==="зад")   return `left:50%;margin-left:-86px;bottom:${g["зад"]||"28%"};z-index:1`;
  return `left:50%;margin-left:-28px;bottom:${g[s]||"20%"};z-index:${s==="на"?3:1}`;
};
R.place=e=>{
  const TR="transition:left .4s ease,right .4s ease,bottom .4s ease,margin-left .4s ease";
  stage().innerHTML=`
    <div style="position:relative;width:100%;max-width:360px;height:250px;margin:0 auto">
      <span style="position:absolute;left:50%;bottom:8%;width:200px;margin-left:-100px;
        z-index:2">${ART[e.container]()}</span>
      <span id="pobj" style="position:absolute;width:56px;${TR};
        ${placePos(e.container,"старт")}">${ART[e.item]()}</span>
    </div>
    <div class="pad" style="margin-top:18px">`+e.spots.map(s=>
      `<button class="key wide" type="button" data-s="${s}">${s}</button>`).join("")+`</div>`;
  const obj=document.getElementById("pobj");
  stage().querySelectorAll(".key").forEach(n=>n.onclick=()=>{
    const s=n.dataset.s;
    stage().querySelectorAll(".key").forEach(k=>k.removeAttribute("data-state"));
    obj.setAttribute("style",`position:absolute;width:56px;${TR};${placePos(e.container,s)}`);
    if(s===e.ask){ n.dataset.state="ok"; fb("Точно там!","ok"); mark(e.id) }
    else { n.dataset.state="no"; fb("Виж къде застана. Това не е вярното място.","no") }
  });
  ctl([{t:"Отначало",g:1,fn:()=>{R.place(e);fb("")}}]);
};

/* ---- 11. проследяване ---- */
R.trace=e=>{
  const has = e.numeral != null;          /* нулата е валидна цифра, но е „лъжа“ */
  const PATH = has ? ART.numeral(e.numeral) : e.path;
  const VB   = has ? "0 0 100 100" : "0 0 470 260";
  const SW1  = has ? 11 : 16, SW2 = has ? 5 : 7, DOT = has ? 5 : 11;
  /* guide: "full" (ясен пунктир) | "faint" (избледнял) | "none" (само начална точка)
     — трите стъпки на „мокро – сухо – опитай“. tol: ширина на пътеката. */
  const GUIDE = e.guide || "full";
  const TOL  = (e.tol || (has ? 9 : 30)) * (GUIDE==="none" ? 1.5 : 1);
  const LANE = e.lane ? `<path d="${e.path}" fill="none" stroke="var(--text)" stroke-width="${e.tol*2+5}"
      stroke-linecap="round" stroke-linejoin="round"/>
    <path d="${e.path}" fill="none" stroke="var(--surface)" stroke-width="${e.tol*2}"
      stroke-linecap="round" stroke-linejoin="round"/>` : "";
  const GOP = GUIDE==="faint" ? .28 : GUIDE==="none" ? 0 : 1;
  /* Дърветата се слагат като голи фигури в общото платно. Вложен
     <svg> тук не върши работа: той си отваря собствен прозорец и
     не се смалява от transform-а на групата. */
  const treeG = `<g fill="none" stroke="${C.ink}" stroke-width="3.2"
      stroke-linecap="round" stroke-linejoin="round">
      ${rect(47,58,6,20,C.brown,1)}${circ(50,42,20,C.leaf)}</g>`;
  const trees=(e.trees||[]).map(([x,y])=>
    `<g transform="translate(${x-27.5},${y-27.5}) scale(0.55)">${treeG}</g>`).join("");
  /* Дърветата се рисуват НАД пунктира: врабчето каца на тях, значи
     пътят минава зад короните, а не върху тях. */
  stage().innerHTML=`<div class="tracebox"><svg viewBox="${VB}" id="ts">
    ${e.deco?`<path d="${e.deco}" fill="none" stroke="var(--text)" stroke-width="${SW2+2}"
      stroke-linecap="round" stroke-linejoin="round"/>`:""}
    ${LANE}
    ${e.lane?"":`<path d="${PATH}" fill="none" stroke="var(--rule)" stroke-width="${SW1}" opacity="${GOP}"
      stroke-linecap="round" stroke-dasharray="${has?"2 8":"3 12"}"/>`}
    ${trees}
    <path id="tg" d="${PATH}" fill="none" stroke="transparent" stroke-width="2"/>
    <path id="dr" d="" fill="none" stroke="var(--c-green)" stroke-width="${SW2}"
      stroke-linecap="round" stroke-linejoin="round"/>
    <g id="ends"></g>
    <circle id="p1" r="${DOT}" fill="var(--c-red)"/>
    <circle id="p0" r="${DOT}" fill="var(--c-green)"/>
  </svg></div>`;
  const S=document.getElementById("ts"), T=document.getElementById("tg"), D=document.getElementById("dr");
  const L=T.getTotalLength(), pts=[];
  for(let i=0;i<=240;i++) pts.push(T.getPointAtLength(L*i/240));
  const set=(id,p)=>{const n=document.getElementById(id);n.setAttribute("cx",p.x);n.setAttribute("cy",p.y)};
  set("p0",pts[0]); set("p1",pts[240]);
  if(GUIDE==="none") document.getElementById("p1").setAttribute("opacity","0");
  /* Картинки в двата края: „заведи пчелата до цветето“. Слагат се
     встрани от точката, срещу посоката на пътя, за да не я закриват. */
  if(e.ends && !has){
    const Z=76, vw=470, vh=260;
    const place=(k,p,q)=>{ if(!k||!IMG[k]) return "";
      const dx=p.x-q.x, dy=p.y-q.y, n=Math.hypot(dx,dy)||1;
      let x=p.x+dx/n*48-Z/2, y=p.y+dy/n*48-Z/2;
      x=Math.max(0,Math.min(vw-Z,x)); y=Math.max(0,Math.min(vh-Z,y));
      return `<image href="${IMG[k]}" x="${x}" y="${y}" width="${Z}" height="${Z}"/>`; };
    document.getElementById("ends").innerHTML =
      place(e.ends[0],pts[0],pts[8]) + place(e.ends[1],pts[240],pts[232]);
  }
  const vb=VB.split(" ").map(Number);
  let on=false,d="",best=0,stray=false;
  const loc=ev=>{const r=S.getBoundingClientRect(),t=ev.touches?ev.touches[0]:ev;
    return {x:(t.clientX-r.left)/r.width*vb[2], y:(t.clientY-r.top)/r.height*vb[3]}};
  const near=p=>{let m=1e9,mi=0;pts.forEach((q,i)=>{const dd=(q.x-p.x)**2+(q.y-p.y)**2;
    if(dd<m){m=dd;mi=i}});return{dist:Math.sqrt(m),i:mi}};
  const start=ev=>{const p=loc(ev); if(near(p).dist>TOL) return;
    on=true;stray=false;best=0;d=`M ${p.x} ${p.y}`;D.setAttribute("d",d);fb("");ev.preventDefault()};
  const move=ev=>{if(!on)return;ev.preventDefault();
    const p=loc(ev),n=near(p); if(n.dist>TOL) stray=true;
    d+=` L ${p.x} ${p.y}`;D.setAttribute("d",d); if(n.i>best)best=n.i};
  const end=()=>{if(!on)return;on=false;
    const pct=Math.round(best/240*100);
    if(pct>=92&&!stray){fb("Стигна до края, без да се откъснеш!","ok");mark(e.id)}
    else if(pct>=92) fb("Стигна до края, но излезе от пътя. Пробвай по-бавно.","no");
    else fb(`Стигна до ${pct}% от пътя. Продължи до червената точка.`,"no")};
  ["mousedown","touchstart"].forEach(t=>S.addEventListener(t,start,{passive:false}));
  ["mousemove","touchmove"].forEach(t=>S.addEventListener(t,move,{passive:false}));
  ["mouseup","mouseleave","touchend","touchcancel"].forEach(t=>S.addEventListener(t,end));
  ctl([{t:"Изтрий линията",g:1,fn:()=>{D.setAttribute("d","");d="";best=0;stray=false;fb("")}},
       {t:"Принтирай",g:1,fn:()=>printTrace(e,PATH,VB,has)}]);
};

/* Печатен лист: същият път, три пъти, пунктирано — за молив и хартия.
   Изследванията показват, че екранът учи движението, но не заменя молива. */
function printTrace(e,PATH,VB,has){
  let sh=document.getElementById("printsheet");
  if(!sh){ sh=document.createElement("div"); sh.id="printsheet"; document.body.appendChild(sh); }
  const T=document.getElementById("tg"), P0=T.getPointAtLength(0);
  const one=`<svg viewBox="${VB}" style="width:100%;height:${has?"auto":"72mm"};display:block;margin:0 0 6mm">
    <path d="${PATH}" fill="none" stroke="#999" stroke-width="${has?3:5}" stroke-linecap="round"
      stroke-linejoin="round" stroke-dasharray="${has?"1.5 5":"2 9"}"/>
    <circle cx="${P0.x}" cy="${P0.y}" r="${has?3.5:8}" fill="#2E7D51"/></svg>`;
  sh.innerHTML=`<h1 style="font:600 18pt Literata,serif;margin:0 0 2mm">${e.title}</h1>
    <p style="font:12pt sans-serif;margin:0 0 6mm">${e.instr}</p>`+
    (has?`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6mm">${one.repeat(9)}</div>`:one.repeat(3))+
    `<p style="font:9pt sans-serif;color:#666;margin-top:4mm">Имe: ____________________ &nbsp; Дата: ____________</p>`;
  document.body.classList.add("printing");
  const done=()=>{document.body.classList.remove("printing");removeEventListener("afterprint",done)};
  addEventListener("afterprint",done); print();
}

/* паролата никога не се пази в чист вид — дори в демото */
async function hashPw(email,pw){
  const s=email.toLowerCase()+"|"+pw;
  try{
    const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));
    return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
  }catch(e){ let h=7; for(const c of s) h=(h*31+c.charCodeAt(0))|0; return "x"+h }
}
