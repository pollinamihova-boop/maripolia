async function submitAuth(mode, f, token){
  const v = n => (f.elements[n] ? (f.elements[n].type==="checkbox" ? f.elements[n].checked : f.elements[n].value.trim()) : "");
  const err = t => { document.getElementById("aerr").textContent = t };
  const email = (v("email")||"").toLowerCase();

  if(mode==="forgot"){
    if(!okEmail(email)) return err("Проверете имейла.");
    let t = "";
    if(DB.users[email]){ t = tok()+tok(); DB.resets[t] = {email, exp: Date.now()+3600e3}; saveDB() }
    return authScreen("sent", "", t);
  }

  if(mode==="reset"){
    const r = DB.resets[token]; if(!r || r.exp < Date.now()) return authScreen("reset","",token);
    if(v("pw").length < 8) return err("Паролата трябва да е поне 8 знака.");
    if(v("pw") !== v("pw2")) return err("Двете пароли не съвпадат.");
    const u = DB.users[r.email]; if(!u) return authScreen("reset","",token);
    u.pw = await hashPw(r.email, v("pw")); delete DB.resets[token]; saveDB();
    if(u.status==="pending") return authScreen("pending", r.email);
    if(u.status==="blocked"){ clearHash(); return authScreen("login","Профилът е спрян. Свържете се с администратора.") }
    return login(r.email);
  }

  if(mode==="login"){
    if(!okEmail(email) || !v("pw")) return err("Въведете имейл и парола.");
    const u = DB.users[email];
    if(!u || u.pw !== await hashPw(email, v("pw"))) return err("Грешен имейл или парола.");
    if(u.status==="pending") return authScreen("pending", email);
    if(u.status==="blocked") return err("Профилът е спрян. Свържете се с администратора.");
    return login(email);
  }

  if(mode==="reg-roditel" || mode==="reg-logoped"){
    const par = mode==="reg-roditel";
    if(!v("name")) return err("Попълнете името.");
    if(!okEmail(email)) return err("Проверете имейла.");
    if(DB.users[email]) return err("Вече има профил с този имейл. Влезте или изберете „Забравена парола“.");
    if(v("pw").length < 8) return err("Паролата трябва да е поне 8 знака.");
    if(v("pw") !== v("pw2")) return err("Двете пароли не съвпадат.");
    if(!v("terms")) return err("Нужно е да приемете условията.");
    if(par && !v("consent")) return err("Без съгласието на родителя профилът не може да пази напредъка на детето.");
    DB.users[email] = {role: par?"roditel":"logoped", name: v("name"), status: par?"active":"pending",
      pw: await hashPw(email, v("pw")), consent: par?today():undefined};
    saveDB();
    return par ? login(email) : authScreen("pending", email);
  }

  if(mode==="invite"){
    const inv = DB.invites[token]; if(!inv) return authScreen("invite","",token);
    const has = DB.users[inv.email];
    if(has){
      if(has.pw !== await hashPw(inv.email, v("pw"))) return err("Грешна парола.");
    } else {
      if(!v("name")) return err("Попълнете как да ви наричаме.");
      if(v("pw").length < 8) return err("Паролата трябва да е поне 8 знака.");
      if(v("pw") !== v("pw2")) return err("Двете пароли не съвпадат.");
      if(!v("terms")) return err("Нужно е да приемете условията.");
    }
    if(!v("consent")) return err("Без съгласието на родителя логопедът не може да вижда напредъка.");
    if(!has) DB.users[inv.email] = {role:"roditel", name:v("name"), status:"active",
      pw: await hashPw(inv.email, v("pw"))};
    DB.users[inv.email].consent = today();
    DB.kids[inv.kid].parent = inv.email;
    delete DB.invites[token]; saveDB();
    return login(inv.email);
  }
}

/* ---------- памет и препоръки (петте правила от концепцията) ---------- */
const mastered = h => !!h && h.length>=2 && h[h.length-1].a===1 && h[h.length-2].a===1;
const needsBack = h => !!h && h.length>0 && (h[h.length-1].a===0 || h[h.length-1].a>=3);
const DOMS = GOALS.slice(1);
function pickToday(k){
  const kid = DB.kids[k], H = kid.hist, out = [];
  /* логопедът решава: възложеното е първо */
  kid.hw.forEach(id => { if(out.length<5 && EX.some(e=>e.id===id)) out.push(id) });
  const pool = EX.filter(e => e.age===kid.age && !out.includes(e.id) && !mastered(H[e.id]));
  /* връщане: трудните от последния път — най-много две */
  shuf(pool.filter(e => needsBack(H[e.id]))).slice(0,2).forEach(e => { if(out.length<5) out.push(e.id) });
  /* баланс: областта с най-малко опити идва първа; стъпка нагоре = следваща нова задача */
  const cnt = {}; DOMS.forEach(g => cnt[g]=0);
  Object.keys(H).forEach(id => { const e=EX.find(x=>x.id===id); if(e) cnt[e.g]+=H[id].length });
  const order = DOMS.slice().sort((a,b) => cnt[a]-cnt[b]);
  const fresh = shuf(pool.filter(e => !H[e.id] && !out.includes(e.id)));
  for(let i=0; out.length<5 && fresh.length && i<40; i++){
    const g = order[i%order.length], j = fresh.findIndex(e=>e.g===g);
    if(j>=0){ out.push(fresh[j].id); fresh.splice(j,1) }
  }
  shuf(pool).forEach(e => { if(out.length<5 && !out.includes(e.id)) out.push(e.id) });
  return out;
}

function kidProgress(kid){
  const H = kid.hist;
  return `<div class="prog"><h4>${esc(kid.name)} <span class="mut">· ${kid.age} г.</span></h4>`+
    DOMS.map(g => {
      const pool = EX.filter(e => e.g===g && e.age===kid.age).length || 1;
      const ids = Object.keys(H).filter(id => { const e=EX.find(x=>x.id===id); return e && e.g===g });
      const m = ids.filter(id => mastered(H[id])).length, w = ids.length - m;
      return `<div class="prow"><span>${g}</span><span class="ptrack">
        <i class="m" style="width:${Math.min(100,m/pool*100)}%"></i>
        <i class="w" style="width:${Math.min(100,w/pool*100)}%"></i></span>
        <span class="pv">${m} / ${pool}</span></div>`;
    }).join("")+
    `<div class="legend"><span><i style="background:var(--c-green)"></i>усвоени</span>
      <span><i style="background:var(--c-yellow)"></i>в процес</span>

    run.ids.forEach((id,i) => (kid.hist[id] = kid.hist[id] || []).push({d, a:run.res[i]}));

function kidStats(kid){
  const H = kid.hist, ids = Object.keys(H), byM = {};
  let tries = 0, n = 0;
  ids.forEach(id => { const e = EX.find(x=>x.id===id);
    H[id].forEach(r => { if(r.a>0){ tries+=r.a; n++ }
      if(e) (byM[e.m] = byM[e.m] || []).push(r.a || 4) }) });
  const hard = Object.entries(byM).filter(([k,v]) => v.length>=2)
    .map(([k,v]) => [k, v.reduce((a,b)=>a+b,0)/v.length]).sort((a,b) => b[1]-a[1])[0];
  return { solved: ids.filter(id => H[id].some(r=>r.a>0)).length, mast: ids.filter(id=>mastered(H[id])).length,
    avg: n ? tries/n : 0, hard };
}

  btn.onclick = () => {

    t = setTimeout(() => { armed = false; btn.textContent = label }, 4000);
  };
}

/* Нова механика: показва се, скрива се, после се пита. */
R.memo = e => {
  const sec = e.sec || 5;
  let timer = null, seq = [];
  const row = (arr, btn) => `<div class="row">`+arr.map((it,i) =>
    btn ? `<button class="item" type="button" data-i="${i}">${it.a()}${it.l?`<span class="lbl">${it.l}</span>`:""}</button>`
        : `<span class="item look">${it.a()}${it.l?`<span class="lbl">${it.l}</span>`:""}</span>`).join("")+`</div>`;

  function memorize(){
    clearInterval(timer); seq = []; fb("");
    let t = sec;
    stage().innerHTML = `<p class="memo-t">Гледай и запомни · <b id="mcd">${t}</b></p>` + row(e.show, false);
    ctl([{t:"Готов съм", fn:ask}]);
    timer = setInterval(() => {
      const n = document.getElementById("mcd");
      if(!n){ clearInterval(timer); return }  /* излезли сме от задачата */
      t--; n.textContent = Math.max(t,0);
      if(t<=0){ clearInterval(timer); ask() } }, 1000);
  }
  function ask(){
    clearInterval(timer);
    if(!stage()) return;                     /* задачата вече е затворена */
    const opts = e.k==="order" ? shuf(e.show) : e.opts;
    stage().innerHTML = (e.after
        ? `<p class="memo-cap">Сега на масата са:</p>` + row(e.after, false) + `<div class="memo-sep"></div>` : "") +
      `<p class="memo-q">${e.q}</p>` + row(opts, true);
    const btns = [...stage().querySelectorAll(".item[data-i]")];
    if(e.k==="many"){
      let p = new Set();
      btns.forEach((n,i) => n.onclick = () => { p.has(i)?p.delete(i):p.add(i);
        n.dataset.state = p.has(i) ? "sel" : ""; fb("") });
      ctl([{t:"Провери", fn:()=>{
          const w = new Set(e.correct), ok = p.size===w.size && [...p].every(i=>w.has(i));
          btns.forEach((n,i)=>{ if(p.has(i)) n.dataset.state = w.has(i)?"ok":"no" });
          ok ? (fb("Точно! Всичко си спомни.","ok"), mark(e.id)) : fb("Не съвсем. Виж пак и опитай.","no") }},
        {t:"Покажи пак", g:1, fn:memorize}]);
      return;
    }
    if(e.k==="order"){
      ctl([{t:"Покажи пак", g:1, fn:memorize}]);
      btns.forEach((n,i) => n.onclick = () => {
        const want = e.show[seq.length];
        if(opts[i]===want){ n.dataset.state="ok"; n.disabled=true; seq.push(i);
          if(seq.length===e.show.length){ fb("Браво! Точно този ред.","ok"); mark(e.id) }
          else fb(`Следващата — ${seq.length+1}.`) }
        else { n.dataset.state="no"; fb("Не беше този. Започни отначало.","no");
          setTimeout(()=>{ seq=[]; ask() }, 900) } });
      fb("Докосни първата картинка.");
      return;
    }
    btns.forEach((n,i) => n.onclick = () => {
      if(i===e.correct){ n.dataset.state="ok"; fb("Браво!","ok"); mark(e.id) }
      else { n.dataset.state="no"; fb("Не е тази. Помисли пак.","no") } });
    ctl([{t:"Покажи пак", g:1, fn:memorize}]);
  }
  memorize();
};

R.draw = e => {
  let c = "#2B2B2B", w = 8, down = false, last = null;
  stage().innerHTML = `<div class="pal" id="pal">${PALETTE.map(([v,n]) =>
      `<button type="button" class="sw" data-c="${v}" aria-label="${n}" aria-pressed="${v===c}"

  const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
  ctx.fillStyle = "#FFFDF8"; ctx.fillRect(0,0,cv.width,cv.height);
  if(e.base) e.base(ctx);
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  const pos = ev => { const r = cv.getBoundingClientRect();
    return [ (ev.clientX-r.left)*cv.width/r.width, (ev.clientY-r.top)*cv.height/r.height ] };
  const start = ev => { down = true; last = pos(ev); cv.setPointerCapture(ev.pointerId); ev.preventDefault() };
  const move  = ev => { if(!down) return; const p = pos(ev);
    ctx.strokeStyle = c; ctx.lineWidth = w;
    ctx.beginPath(); ctx.moveTo(last[0],last[1]); ctx.lineTo(p[0],p[1]); ctx.stroke(); last = p; ev.preventDefault() };
  const end   = () => { down = false };
  cv.addEventListener("pointerdown", start); cv.addEventListener("pointermove", move);
  addEventListener("pointerup", end); cv.addEventListener("pointercancel", end);
  stage().querySelectorAll("#pal .sw[data-c]").forEach(n => n.onclick = () => { c = n.dataset.c;

/* ---- звук: прости тонове ---- */
let LG_AC = null;
function playSeq(seq, onFail){
  try{
    LG_AC = LG_AC || new (window.AudioContext || window.webkitAudioContext)();
    if(LG_AC.state === "suspended") LG_AC.resume();
    let t = LG_AC.currentTime + 0.08;
    seq.forEach(s => {
      const o = LG_AC.createOscillator(), g = LG_AC.createGain();
      o.type = "sine"; o.frequency.value = s.f;
      o.connect(g); g.connect(LG_AC.destination);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.25, t + 0.04);
      g.gain.setValueAtTime(0.25, t + s.d - 0.06);
      g.gain.exponentialRampToValueAtTime(0.0001, t + s.d);
      o.start(t); o.stop(t + s.d + 0.03);
      t += s.d + (s.gap == null ? 0.18 : s.gap);
    });
    return true;
  }catch(err){ if(onFail) onFail(); return false }
}

R.speed = e => {
  let left = e.sec, found = new Set(), timer = null, on = false;
  const total = e.items.filter(i=>i.good).length;
  const draw = () => {
    stage().innerHTML = `<div class="timerbar"><i style="width:${on?left/e.sec*100:100}%"></i></div>
      <p class="memo-cap">${on ? `Остават ${left} сек · намери ${total-found.size}` : "Натисни „Старт“ и започни"}</p>
      <div class="row">${e.items.map((it,i) =>
        `<button class="item sm" type="button" data-i="${i}" ${found.has(i)?'data-state="ok"':""} ${on?"":"disabled"}>${it.a()}</button>`).join("")}</div>`;
    stage().querySelectorAll(".item[data-i]:not([disabled])").forEach(n => n.onclick = () => {
      const i = +n.dataset.i;
      if(e.items[i].good){ found.add(i); n.dataset.state="ok";
        if(found.size===total){ stop(); fb("Всички! И то навреме.","ok"); mark(e.id) } else fb("") }
      else { n.dataset.state="no"; fb("Не това. Търси само правилните.","no"); setTimeout(()=>{ if(n) n.dataset.state="" }, 500) }
    });
  };
  const stop = () => { on = false; clearInterval(timer); draw();
    ctl([{t:"Още веднъж", fn:start}]) };
  const start = () => { left = e.sec; found = new Set(); on = true; fb(""); draw();
    ctl([{t:"Спри", g:1, fn:stop}]);
    clearInterval(timer);
    timer = setInterval(() => {
      if(!stage()){ clearInterval(timer); on=false; return }   /* задачата е затворена */
      left--;
      if(left<=0){ stop(); if(found.size<total) fb(`Времето свърши. Намери ${found.size} от ${total}. Опитай пак.`,"no") }
      else draw(); }, 1000) };
  draw(); ctl([{t:"Старт", fn:start}]);
};

let LG_VOICES = [];
function lgVoices(){
  try{ LG_VOICES = speechSynthesis.getVoices() || [] }catch(e){ LG_VOICES = [] }
  return LG_VOICES;
}
const bgVoice = () => lgVoices().find(v => /^bg/i.test(v.lang));
try{ speechSynthesis.addEventListener("voiceschanged", () => { lgVoices();
  document.querySelectorAll(".saybtn").forEach(b => b.disabled = !bgVoice()) }) }catch(e){}
function sayBG(text, btn){
  const v = bgVoice();
  if(!v){ if(btn) btn.title = "Устройството няма български глас"; return false }
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.voice = v; u.lang = v.lang; u.rate = .88; u.pitch = 1.05;
    speechSynthesis.speak(u); return true;
  }catch(e){ return false }
}

const bgDate = (iso) => { const d = iso ? new Date(iso) : new Date();
  return `${String(d.getDate()).padStart(2,"0")}.${String(d.getMonth()+1).padStart(2,"0")}.${d.getFullYear()}` };
function childProfile(k){
  MODE="office"; run=null;
  const kid = DB.kids[k], H = kid.hist;
  setHead("Родител", "Как се справя " + kid.name, false); whoChip();
  const rows = DOMS.map(g => {
    const pool = EX.filter(e => e.g===g && e.age===kid.age).length || 1;
    const ids = Object.keys(H).filter(id => { const e = EX.find(x => x.id===id); return e && e.g===g });
    const m = ids.filter(id => mastered(H[id])).length;
    const tries = ids.flatMap(id => H[id].map(r => r.a || 0)).filter(x => x>0);
    const avg = tries.length ? tries.reduce((a,b)=>a+b,0)/tries.length : 0;
    return {g, pool, tried: ids.length, m, avg, pct: Math.round(m/pool*100),
            wpct: Math.round(Math.max(0,ids.length-m)/pool*100)};
  });
  const played = rows.filter(r => r.tried >= 3);
  const strong = played.slice().sort((a,b) => (a.avg-b.avg) || (b.pct-a.pct)).slice(0,2);
  const weak = played.slice().sort((a,b) => (b.avg-a.avg) || (a.pct-b.pct)).slice(0,2);
  const solved = Object.keys(H).filter(id => H[id].some(r => r.a>0)).length;
  const word = n => n===1 ? "задача" : "задачи";
  const txt = !played.length
    ? `<p>${esc(kid.name)} тепърва започва. Когато има поне няколко решени задачи във всяка област, тук ще се появи картина на силните страни.</p>`
    : `<p><b>Върви най-леко:</b> ${strong.map(r=>r.g.toLowerCase()).join(" и ")}. Тук ${esc(kid.name)} решава бързо и с малко опити.</p>
       <p><b>Струва си да се поупражни:</b> ${weak.map(r=>r.g.toLowerCase()).join(" и ")}. Тези задачи отнемат повече опити — по две-три на ден са достатъчни.</p>`;
  const d = screen(`<div class="prof">
    <div class="profhead">
      <span class="kidav sm">${avatar(kid.av)}</span>
      <div><h2>${esc(kid.name)}<span class="mut"> · ${kid.age} г.</span></h2>
      <p class="mut">Решени ${solved} ${word(solved)} · ${bgDate()}</p></div>
    </div>
    <div class="profbars">${rows.map(r => `
      <div class="pbar"><span class="pg">${r.g}</span>
        <span class="ptrack"><i class="m" style="width:${Math.min(100,r.pct)}%"></i>
          <i class="w" style="width:${Math.min(100-Math.min(100,r.pct),r.wpct)}%"></i></span>
        <span class="pv">${r.m} / ${r.tried}</span></div>`).join("")}</div>
    <div class="proflegend"><span><i style="background:var(--c-green)"></i>усвоени</span>
      <span><i style="background:var(--c-yellow)"></i>започнати</span>
      <span>вдясно: усвоени / опитани</span></div>
    <div class="proftext">${txt}</div>
    <p class="profnote">Това е игрова картина на упражненията, а не тест и не диагноза.
      При съмнение за развитието на детето се обърнете към логопед или психолог.</p>
    <div class="controls noprint">
      <button class="btn" type="button" id="pprint">Разпечатай</button>
      <button class="btn ghost" type="button" id="pcopy">Копирай текста</button>
      <button class="btn ghost" type="button" id="pback">← Назад</button>
    </div><p class="okmsg noprint" id="pmsg"></p></div>`);
  document.getElementById("pprint").onclick = () => { try{ print() }catch(e){} };
  document.getElementById("pback").onclick = () => childToday(k);
  document.getElementById("pcopy").onclick = async () => {
    const plain = `Мариполия — как се справя ${kid.name} (${kid.age} г.), ${bgDate()}\n` +
      rows.map(r => `${r.g}: усвоени ${r.m} от ${r.pool}`).join("\n") + "\n" +
      d.querySelector(".proftext").innerText + "\nИгрова картина на упражненията, не е тест или диагноза.";
    try{ await navigator.clipboard.writeText(plain);
      document.getElementById("pmsg").textContent = "Текстът е копиран — можете да го поставите в имейл или съобщение." }
    catch(e){ document.getElementById("pmsg").textContent = "Копирането не стана. Разпечатайте или направете снимка на екрана." }
  };
}

/* ---------- 3. Кутия с инструменти ---------- */
const TOOLPICS = ["cat","dog","ball","apple","sun","fish","car","bee"];
function beep(){
  try{
    const AC = LG_AC = LG_AC || new (window.AudioContext||window.webkitAudioContext)();
    let t = AC.currentTime;
    [660,880].forEach((f,i) => { const o=AC.createOscillator(), g=AC.createGain();
      o.frequency.value=f; o.connect(g); g.connect(AC.destination);
      g.gain.setValueAtTime(0.0001,t+i*0.25); g.gain.exponentialRampToValueAtTime(0.3,t+i*0.25+0.03);
      g.gain.exponentialRampToValueAtTime(0.0001,t+i*0.25+0.22);
      o.start(t+i*0.25); o.stop(t+i*0.25+0.25) });
  }catch(e){}
}
function toolbox(){
  MODE="office"; run=null;
  setHead("Кабинет на логопеда", "Инструменти", false); whoChip();
  let left = 120, timer = null, running = false, cnt = 0, face = 1, spinning = false;
  const dieDots = n => {
    const P = {1:[[50,50]],2:[[28,28],[72,72]],3:[[28,28],[50,50],[72,72]],
      4:[[28,28],[72,28],[28,72],[72,72]],5:[[28,28],[72,28],[50,50],[28,72],[72,72]],
      6:[[28,25],[72,25],[28,50],[72,50],[28,75],[72,75]]}[n];
    return `<svg viewBox="0 0 100 100" class="die"><rect x="4" y="4" width="92" height="92" rx="18"
      fill="var(--surface)" stroke="var(--ink)" stroke-width="4"/>
      ${P.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="9" fill="var(--ink)"/>`).join("")}</svg>`;
  };
  const mmss = s => Math.floor(s/60) + ":" + String(s%60).padStart(2,"0");
  const draw = () => {
    const d = document.getElementById("detail");
    d.innerHTML = `<button class="back" type="button" id="tbk">← Всички задачи</button>
      <div class="tools">
        <section class="tool"><h3>Пясъчен часовник</h3>
          <div class="bigtime ${left<=10&&running?"low":""}" id="tt">${mmss(left)}</div>
          <div class="seg" id="presets">${[60,120,180,300].map(s=>
            `<button type="button" data-s="${s}" aria-pressed="${s===left&&!running}">${s/60} мин</button>`).join("")}</div>
          <div class="controls"><button class="btn" type="button" id="tgo">${running?"Спри":"Старт"}</button>
            <button class="btn ghost" type="button" id="trs">Нулирай</button></div></section>

        <section class="tool"><h3>Зарче</h3>
          <div class="diebox" id="diebox">${dieDots(face)}</div>
          <div class="controls"><button class="btn" type="button" id="roll">Хвърли</button></div></section>

        <section class="tool"><h3>Въртележка</h3>
          <div class="wheel ${spinning?"spin":""}" id="wheel">${TOOLPICS.map((k,i)=>
            `<span class="wi" style="transform:rotate(${i*45}deg) translateY(-92px) rotate(${-i*45}deg)">${ART[k]?ART[k]():""}</span>`).join("")}
            <span class="needle"></span></div>
          <p class="wres" id="wres"></p>
          <div class="controls"><button class="btn" type="button" id="spin">Завърти</button></div></section>

        <section class="tool"><h3>Брояч</h3>
          <div class="bigtime" id="cnt">${cnt}</div>
          <div class="controls"><button class="btn" type="button" id="cplus">+ 1</button>
            <button class="btn ghost" type="button" id="cminus">− 1</button>
            <button class="btn ghost" type="button" id="czero">0</button></div></section>
      </div>`;
    document.getElementById("tbk").onclick = () => { clearInterval(timer); running=false; officeHome() };
    d.querySelectorAll("#presets button").forEach(b => b.onclick = () => {
      if(running) return; left = +b.dataset.s; draw() });
    document.getElementById("tgo").onclick = () => {
      if(running){ running=false; clearInterval(timer); draw(); return }
      if(left<=0) left = 60;
      running = true; draw();
      clearInterval(timer);
      timer = setInterval(() => {
        const n = document.getElementById("tt");
        if(!n){ clearInterval(timer); running=false; return }   /* излезли сме от инструментите */
        left--;
        if(left<=0){ left=0; running=false; clearInterval(timer); beep() }
        n.textContent = mmss(left); n.classList.toggle("low", left<=10);
        if(!running) draw(); }, 1000);
    };
    document.getElementById("trs").onclick = () => { running=false; clearInterval(timer); left=120; draw() };
    document.getElementById("roll").onclick = () => {
      const box = document.getElementById("diebox"); box.classList.remove("rolling"); void box.offsetWidth;
      box.classList.add("rolling");
      let n = 0; const iv = setInterval(() => {
        const bx = document.getElementById("diebox");
        if(!bx){ clearInterval(iv); return }
        face = 1+(0|Math.random()*6); bx.innerHTML = dieDots(face); if(++n>7) clearInterval(iv) }, 70);
    };
    document.getElementById("spin").onclick = () => {
      const w = document.getElementById("wheel");
      const pick = 0|Math.random()*TOOLPICS.length;
      const turns = 3 + Math.random();
      w.style.transition = "transform 1.5s cubic-bezier(.17,.67,.2,1)";
      w.style.transform = `rotate(${turns*360 + (360 - pick*45)}deg)`;
      document.getElementById("wres").textContent = "…";
      setTimeout(() => { document.getElementById("wres").textContent = "Падна се картинка № " + (pick+1) }, 1550);
    };
    document.getElementById("cplus").onclick = () => { cnt++; document.getElementById("cnt").textContent = cnt };
    document.getElementById("cminus").onclick = () => { cnt = Math.max(0,cnt-1); document.getElementById("cnt").textContent = cnt };
    document.getElementById("czero").onclick = () => { cnt=0; document.getElementById("cnt").textContent = 0 };
  };
  document.getElementById("list").hidden = true;
  document.getElementById("detail").hidden = false;
  draw(); scrollTo(0,0);
}

function guideScreen(role="parent"){
  MODE="office"; run=null;
  const G = GUIDES[role];

  const tabs = u && u.role!=="roditel"
    ? [["logoped","За логопеда"],["teacher","За учителя"],["parent","За родителя"]]
    : [["parent","За родителя"]];
  setHead(u && u.role==="roditel" ? "Родител" : "Кабинет", "Ръководство", false); whoChip();
  const d = screen(`<div class="guide">
    ${tabs.length>1 ? `<div class="seg gtabs">${tabs.map(([k,l]) =>
      `<button type="button" data-g="${k}" aria-pressed="${k===role}">${l}</button>`).join("")}</div>` : ""}
    <h2>${G.title}</h2>
    <p class="glead">${G.lead}</p>
    <p class="gver">Обновено на ${GUIDE_VER} · ${EX.length} задачи в ${GOALS.length-1} области</p>
    ${G.secs.map((s,i) => `<section class="gsec"><h3><span class="gn">${String(i+1).padStart(2,"0")}</span>${s.h}</h3>
      ${(s.p||[]).map(t=>`<p>${t}</p>`).join("")}
      ${s.l ? `<ul>${s.l.map(t=>`<li>${t}</li>`).join("")}</ul>` : ""}</section>`).join("")}
    <div class="controls noprint">
      <button class="btn" type="button" id="gprint">Разпечатай</button>
      <button class="btn ghost" type="button" id="gback">← Назад</button></div>
  </div>`);
  d.querySelectorAll(".gtabs button").forEach(b => b.onclick = () => guideScreen(b.dataset.g));
  document.getElementById("gprint").onclick = () => { try{ print() }catch(e){} };
  document.getElementById("gback").onclick = () => {
    const r = me() && me().role;
    r==="roditel" ? whoPlays() : r==="admin" ? adminHome() : officeHome();
  };
}

        <p>В основата е сборникът с упражнения на доц. д-р Маргарита Станкова, д.м., допълнен с нови задачи.</p></div>
    </div>
  </div></section>
  ${lWave(true)}

  <section class="l-sec" id="l-areas"><div class="lw">

    <h2>Дванайсет места, които детето открива</h2>
    <p class="intro">Всяко място е една област на развитие. Пътечката води от едно към друго, а всяко решено упражнение отваря ново цвете на поляната.</p>

      ${L_PLACES.map(p => `<div class="mp${p.soon?" soon":""}" style="left:${p.x}%;top:${p.y}%">

  <section class="l-sec tint" id="l-guides"><div class="lw">
    <p class="l-eyebrow">Водачите</p>
    <h2>Маргаритка и Поли водят детето</h2>
    <div class="l-guides">
      <div class="l-card"><div class="ic bg-butter">${lImg("daisy")}</div><h3>Маргаритка</h3>
        <p>Цветето, което подава задачите и се радва на всяко решение. Никога не се сърди, когато нещо не стане от първия път.</p></div>
      <div class="l-card"><div class="ic bg-lilac glowpulse">${FIREFLY}</div><h3>Поли</h3>
        <p>Светулката, която свети по-силно с всяко ново умение и осветява следващата пътечка по картата.</p></div>
    </div>
  </div></section>
  <section class="l-sec tint" id="l-how"><div class="lw">
    <p class="l-eyebrow">Как работи</p>
    <h2>Три стъпки до първата игра</h2>
    <p class="intro">Регистрацията отнема минута. След това детето влиза само с едно докосване.</p>
    <div class="l-steps">
      <div class="l-step"><div class="num bg-peach">1</div><h3>Създайте профил</h3>
        <p>Регистрирайте се като родител или приемете поканата от своя логопед.</p></div>
      <div class="l-step"><div class="num bg-mint">2</div><h3>Добавете детето</h3>
        <p>Само прякор, възраст и любима картинка. Без фамилия, дата на раждане или диагноза.</p></div>
      <div class="l-step"><div class="num bg-sky">3</div><h3>Играйте всеки ден</h3>
        <p>Детето докосва своята картинка и започва. Всяко решение се записва.</p></div>
    </div>
  </div></section>

  <section class="l-sec"><div class="lw">
    <p class="l-eyebrow">За кого</p>
    <h2>Удобно и за малки, и за големи</h2>
    <p class="intro">Едно място за детето, което играе, за родителя до него и за логопеда, който води работата.</p>
    <div class="l-who">
      <div class="l-card"><div class="top bg-mint">${lImg("eli-stand")}${lImg("martin-running")}</div><h3>За децата</h3>
        <ul><li>Големи картинки и бутони за малки пръсти</li><li>Избери, подреди, свържи или проследи с пръст</li><li>Играе се на телефон, таблет и компютър</li></ul></div>
      <div class="l-card"><div class="top bg-peach">${lImg("mama-stand")}</div><h3>За родителите</h3>
        <ul><li>Отделен профил за всяко дете</li><li>Готов набор задачи за деня</li><li>Виждате какво е решено и къде има нужда от още упражнения</li></ul></div>
      <div class="l-card"><div class="top bg-lilac">${lImg("teacher")}</div><h3>За логопедите</h3>
        <ul><li>Каталог с упражнения по област и възраст</li><li>Домашно за детето с един линк</li><li>Напредъкът на всички деца на едно място</li></ul></div>
    </div>
  </div></section>

  <section class="l-sec" id="l-about"><div class="lw">
    <p class="l-eyebrow">Екипът</p>
    <h2>Създадена с научна експертиза.<br>Разработена с мисъл за детето.</h2>
    <p class="intro">Платформата обединява научните знания за детското развитие, клиничния опит и възможностите на съвременните дигитални технологии. Зад нея стоят двама университетски преподаватели и изследователи, които превръщат авторски упражнения в интерактивна среда за учене и развитие чрез игра.</p>
    <div class="l-team">
      <article class="l-person">
        <p class="prole">Авторско съдържание и научна концепция</p>
        <div class="pin">
          <div class="av bg-butter"><span>МС</span>${lImg("book","bd")}</div>
          <div>
            <h3>доц. д-р Маргарита Станкова, д.м.</h3>
            <p class="ptags">Детско развитие · Психично здраве · Аутизъм</p>
            <p>Психиатър, доктор на медицинските науки и университетски преподавател с дългогодишна научна и практическа дейност в областта на детското развитие, психичното здраве и разстройствата от аутистичния спектър. Автор на научни публикации и ръководител на докторанти.</p>
            <p>Създател на авторския сборник с упражнения, който стои в основата на платформата. Нейната експертиза определя съдържанието, структурата и последователността на задачите, насочени към развитието на детските умения.</p>
          </div>
        </div>
      </article>
      <article class="l-person">
        <p class="prole">Методическа адаптация и дигитална платформа</p>
        <div class="pin">
          <div class="av bg-lilac"><span>ПМ</span>${lImg("pencil","bd")}</div>
          <div>
            <h3>доц. д-р Полина Михова</h3>
            <p class="ptags">Медицинска информатика · Дигитално здраве · Логопедия</p>
            <p>Университетски преподавател и изследовател в областта на медицинската информатика, телемедицината и дигиталните технологии в здравеопазването. С експертиза в разработването и прилагането на иновативни технологични решения и интерактивни инструменти в логопедичната практика. Магистър по логопедия и специалист по компютърни технологии в медицината.</p>
            <p>Отговаря за методическата адаптация и дигиталната реализация на платформата.</p>
          </div>
        </div>
      </article>
    </div>

    <div class="l-method">
      <div class="mh">
        <p class="l-eyebrow">Методика</p>
        <h3>Принципи, на които стъпваме</h3>
        <p>Упражненията са подбрани и подредени така, че да следват развитието на детето и да свързват работата в кабинета с практиката у дома.</p>
      </div>
      <ol class="ml">
        <li><b>Развитийна рамка</b><span>Дванайсет области — език, памет, внимание, концентрация, слух, емоции, скорост, логическо мислене, ранна математика, зрително възприятие, графомоторика и творчески задачи — всяка с отделни възрастови групи.</span></li>
        <li><b>Постепенност</b><span>Задачите вървят от по-лесно към по-трудно, а следващата се подбира според резултатите на детето.</span></li>
        <li><b>Участие на семейството</b><span>Родителят упражнява с детето у дома между срещите с логопеда, по задачи, които логопедът е избрал.</span></li>
        <li><b>Проследяване на напредъка</b><span>Всяко решение се записва; логопедът вижда обобщение по области и може да промени плана.</span></li>
        <li><b>Дистанционна подкрепа</b><span>Домашните задачи и напредъкът са достъпни онлайн, така че логопедът остава до детето и от разстояние.</span></li>
      </ol>
    </div>
    <p class="l-note">Упражненията подпомагат, но не заместват консултацията и терапията при логопед.</p>
  </div></section>

  <section class="l-sec" style="padding-top:12px"><div class="lw">

    <h2>Грижим се за данните на детето</h2>
    <div class="l-safe" style="margin-top:24px">
      <div>${L_CHECK}<p><b>Само прякор и възраст</b>За детето не пазим фамилия, дата на раждане или диагноза.</p></div>
      <div>${L_CHECK}<p><b>Без имейл за детето</b>Детето влиза през профила на родителя.</p></div>
      <div>${L_CHECK}<p><b>Всеки вижда своето</b>Логопедът вижда само децата, с които работи. Администраторът не вижда резултати.</p></div>
      <div>${L_CHECK}<p><b>Изтриване по всяко време</b>Профил на дете или целия акаунт можете да изтриете сами.</p></div>

  const dec = L.querySelectorAll(".l-final .dec");

  L.querySelectorAll("[data-to]").forEach(b => b.onclick = () => {

    if(t) t.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"}) });
  L.querySelectorAll("[data-go]").forEach(b => b.onclick = () => {

  const scene = document.getElementById("lscene");
  let bub = null, bt = 0;
  scene.querySelectorAll("button").forEach(b => b.onclick = () => {
    b.classList.remove("wig"); void b.offsetWidth; b.classList.add("wig");
    if(bub) bub.remove(); clearTimeout(bt);
    bub = document.createElement("div"); bub.className = "l-bub"; bub.textContent = b.dataset.w;
    const r = b.getBoundingClientRect(), R = scene.getBoundingClientRect();
    const x = Math.min(Math.max(r.left + r.width/2 - R.left, 60), R.width - 60);
    bub.style.left = x+"px"; bub.style.top = Math.max(r.top - R.top + 6, 44)+"px";

function lSay(w){
  try{
    const v = speechSynthesis.getVoices().find(v => /^bg/i.test(v.lang)); if(!v) return;
    speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(w);
    u.voice = v; u.lang = v.lang; u.rate = .85; u.pitch = 1.1; speechSynthesis.speak(u);
  }catch(e){}
}

/* връщане към началото */
const _lAuth = authScreen;
authScreen = function(mode="login", msg="", token=""){
  leaveLanding(); _lAuth(mode, msg, token);
  if(["login","reg-roditel","reg-logoped","forgot","sent"].includes(mode)){
    const a = document.querySelector("#detail .auth");
    if(a){ const b = document.createElement("button"); b.type="button"; b.className="lnk l-back";
      b.textContent = "← Към началната страница"; b.onclick = landing; a.parentNode.insertBefore(b, a) }
  }
};
const _lTrial = trialScreen;
trialScreen = function(){ leaveLanding(); _lTrial();
  const tb = document.getElementById("tb"); if(tb){ tb.textContent = "← Към началната страница"; tb.onclick = landing } };
const _lRoute = route;
route = function(){ leaveLanding(); _lRoute() };
logout = function(){ USER=null; LS.sset("lg-user",null); run=null; MODE="office"; landing() };

/* =========================== СТАРТ =========================== */
addEventListener("hashchange",()=>location.reload());
(async function boot(){
  /* линкът за домашно без вход работи както досега */
  const m=/#hw=([0-9a-z]+)/i.exec(location.hash);
  if(m){ const ids=decHW(m[1]); if(ids.length){ startRun(ids); return } }
  await loadDB();
  const inv=/#invite=([0-9a-z]+)/i.exec(location.hash);
  if(inv){ authScreen("invite","",inv[1]); return }
  const rs=/#reset=([0-9a-z]+)/i.exec(location.hash);
  if(rs){ authScreen("reset","",rs[1]); return }
  const s=LS.sget("lg-user");
  if(s && DB.users[s] && DB.users[s].status==="active"){ USER=s; route(); return }
  if(/#vhod/i.test(location.hash)){ clearHash(); authScreen("login"); return }
  landing();
})();
